name: Install Go from the feed (golang/go master tip)
description: >-
  裝 feed 裡那顆 go-git（= golang/go 的 master tip），與用戶機同源；取代
  actions/setup-go。本檔是**各倉共用的唯一來源**（sing-box / nb4a / dae /
  cronet-go / sing-* 系全部 uses: 這裡），改一處就全部生效。

# 為什麼要有這個 composite，而不是各 job 直接 actions/setup-go：
#   官方**不提供**未發布版本的二進位。查證（2026-10-11）：
#     go.dev/dl/ 只列發布版；go.dev/dl/devel/release.json 回 404；
#     git ls-remote --tags golang/go | grep -c 'refs/tags/go1\.28' = 0
#     （1.28 連 rc tag 都還沒打，最新發布版是 go1.27.2）。
#   所以 setup-go 能拿到的「最新」只有 1.27.2，那不是尖端。用戶機上那顆是
#   feed 的 go-git（實測 `go version` 報 go1.28-devel_<sha>），CI 要吃同一顆
#   就只能吃這個包。
#
# ⚠️ 裝不到就紅，**不退回去用發布版**：退回來這一輪驗的就不是用戶機上那顆
#    toolchain，綠燈會變成假訊號。
#
# 硬體架構（2026-10-11）：
#   x86_64  → 吃 feed 那顆 go-git（本倉 current-repo release 的唯一資產）。
#   aarch64 → feed 那顆**沒有 arm64 檔**，而 arm64 的 Linux leg 還是要吃尖端，
#             所以只能從源碼 bootstrap：拿 runner 預裝的發布版 Go 當 bootstrap
#             跑 make.bash（Go 源碼自舉，不需要額外依賴）。
#   其他架構 → 直接紅，不假裝成功。

inputs:
  repo:
    description: feed 倉（owner/name）
    required: false
    default: Capricornus007/repo

runs:
  using: composite
  steps:
    - name: 裝 golang/go master tip
      shell: bash
      run: |
        set -euo pipefail
        arch=$(uname -m)
        case "$arch" in
          x86_64)
            if ! command -v jq >/dev/null 2>&1; then
              # 缺 jq 就不要用一條 pipe 靜默產出空字串，那會讓下面的 test -n
              # 報「feed 裡沒有 go-git 資產」，把環境問題誤報成 feed 問題。
              echo "::error::容器裡沒有 jq，無法解析 feed 資產清單"
              exit 1
            fi
            pkg=$(curl -fsSL \
                    "https://api.github.com/repos/${{ inputs.repo }}/releases/latest" \
                  | jq -r '.assets[] | select(.name | startswith("go-git-"))
                           | .browser_download_url' | head -n1)
            test -n "$pkg" || { echo "::error::feed 裡沒有 go-git 資產"; exit 1; }
            echo ">> x86_64：取 $pkg"
            curl -fsSL "$pkg" -o "$RUNNER_TEMP/go-git.pkg.tar.zst"
            # 包內容：/usr/lib/go/{bin/go,bin/gofmt,pkg/tool/...} ＋ /usr/bin/go 符號連結，
            # GOROOT 實測為 /usr/lib/go。直接解到 / ，不經 pacman（runner 是 Ubuntu）。
            sudo tar -x --zstd -f "$RUNNER_TEMP/go-git.pkg.tar.zst" -C /
            ;;
          aarch64)
            echo ">> aarch64：feed 的 go-git 只有 x86_64 檔，改從源碼 bootstrap"
            bootstrap=$(command -v go)
            test -n "$bootstrap" \
              || { echo "::error::runner 上沒有可用來 bootstrap 的 go，建不了 tip"; exit 1; }
            echo ">> runner 預裝 = $("$bootstrap" version)"
            src="$RUNNER_TEMP/gosrc"
            command rm -rf "$src"
            git clone --depth 1 https://github.com/golang/go "$src"
            # bootstrap 不能用 runner 預裝那顆：實測 arm64 runner 給的是 go1.24.13，
            # 而 master 的 cmd/dist 要 Go ≥1.26，直接 make.bash 會死在
            # 「found packages main (build.go) and building_Go_requires_Go_1_26_0_or_later」
            # （utls run 38106995366 實測）。用 go 自帶的 toolchain 機制拉一個發布版
            # 當 bootstrap，再把 GOTOOLCHAIN 關回 local 去跑 make.bash。
            export GOTOOLCHAIN=go1.27.2
            go version
            GOROOT_BOOTSTRAP="$(go env GOROOT)"
            export GOROOT_BOOTSTRAP GOTOOLCHAIN=local
            echo ">> bootstrap = $("$GOROOT_BOOTSTRAP/bin/go" version)"
            ( cd "$src/src" && ./make.bash )
            # GOROOT 釘成與 x86_64 那條同樣的路徑，下游 job 不用管自己是哪條來的。
            sudo mkdir -p /usr/lib
            sudo cp -a "$src" /usr/lib/go
            ;;
          *)
            echo "::error::$arch 沒有尖端 Go 的來源（feed 僅 x86_64、源碼 bootstrap 僅 aarch64 可用）"
            exit 1
            ;;
        esac
        # 顯式釘住 GOROOT 與 PATH：GitHub runner 預裝的 Go 也在 PATH 裡，誰先命中
        # 取決於順序，不能靠「應該會蓋過去」這種假設。先 export 再問 go env，
        # 免得下面這幾個查詢打到 runner 預裝那顆 go 上。
        export PATH="/usr/lib/go/bin:$PATH"
        echo "GOROOT=/usr/lib/go" >> "$GITHUB_ENV"
        echo "/usr/lib/go/bin" >> "$GITHUB_PATH"
        # GOPATH/bin 也要進 PATH、並把 GOBIN 顯式設好——這才是 actions/setup-go
        # 悄悄幫我們做的事（實證：綠的那輪日誌印 `GOBIN='/home/runner/go/bin'`）。
        # 少了它，任何「用絕對路徑叫 $GOPATH/bin/xxx、內部再用 LookPath 找另一個
        # 工具」的腳本會紅：nb4a 的 libcore/build.sh:37 `export GOBIND=gobind-matsuri`
        # 就是這樣死在「gomobile-matsuri: gobind was not found」（CI #736/Build #661）。
        gobin="$(go env GOPATH)/bin"
        mkdir -p "$gobin"
        echo "GOBIN=$gobin" >> "$GITHUB_ENV"
        echo "$gobin" >> "$GITHUB_PATH"
        # 不許 go 再去下載官方 toolchain 頂替（go.mod 的 go 指令低於 tip 時，預設
        # 行為可能拉一個發布版回來，那這輪驗的就不是尖端）。
        echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
        go version
        # 硬驗「真的是 tip」：feed 那顆萬一退化成發布版，這裡就要紅，
        # 而不是讓整輪 CI 安靜地用回 1.27.x。
        go version | grep -q -- '-devel' \
          || { echo "::error::裝到的不是 tip：$(go version)"; exit 1; }
