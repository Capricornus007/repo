name: Build Git Packages

# VCS（-git）套件：跟着上游 HEAD 走，oh-my-pi-git 一天能蹦好几个小版本号，
# 所以每小时查一次。绝大多数轮次里「检测目标版本并决定是否需要构建」发现
# 版本没变，几分钟就整轮跳过，开销很小。
#
# 这些包单个只要几分钟到二十来分钟，跟内核分开跑就不会被内核堵在队列后面。
# 因为不存在「跑到下一个整点还没编完」的情况，cancel-in-progress 可以放心
# 开着：真撞上了，取消旧的换新的反而更合理。

on:
  push:
    branches:
      - master
  schedule:
    # 每 3 小時一次（用戶 2026-10-03 指示再延長；此前是 90 分鐘：兩條 cron 湊成
    # 00:00/03:00/… 加 01:30/04:30/…）。實測一輪矩陣本身就要跑 50–95 分鐘
    # （#331 用 50 分 55 秒、#330 用 1 時 3 分 27 秒），90 分鐘節拍等於幾乎無間隙連轉，
    # 而且 openai-codex-git 單包 release 編譯就要 60 分鐘以上。
    # 只留一條 cron，避免「兩條錯峰」又被解讀成 90 分鐘節拍。
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: build-git-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: write
    # 可重用 workflow 默认拿不到调用方的 secrets，必须显式继承，
    # 否则 PERSONAL_BUILD_TOKEN 为空、回推 PKGBUILD 会静默失败。
    secrets: inherit
    with:
      timeout_minutes: 360
      # glib2-git 與 linux-firmware-nfp-git 改由本倉源碼直出（用戶 2026-10-10 指定）：
      # 這兩顆原本只從 chaotic-aur 拿，而 chaotic 那五台鏡像走 Cloudflare 的 IPv6 一律
      # TLS 8 秒被斷（實測釘 IPv4 才 0.46 秒回 303），鏡像一抖就「無法取得」。AUR 兩顆
      # 都在，所以 kind: aur 直接取 AUR 的 PKGBUILD 來編。
      # 2026-10-10 更正：linux-firmware-nfp-git 不再取 AUR（AUR 那份在 CI 從沒建成功過，
      # 用戶裁決改自己寫），PKGBUILD 維護在本倉 linux-firmware-nfp-git/ 目錄、由
      # build-packages.yml 的 in-tree 分支攔截；矩陣仍留 kind:aur 只為借用 giant if 的
      # `matrix.kind != 'aur'` 跳過回推校驗和（與 pnpm-git 同一手法，理由見
      # docs/in-tree-packages.md）。
      # ⚠️ packages 是 `packages: |` 的**純 JSON 字面塊**，下游用 fromJSON(inputs.packages)
      # 解析——註解只能寫在這裡，寫進方括號裡面會讓整條矩陣（130+ job）一起解析失敗。
      # （2026-10-11 真的踩過：llvm-git 那條的說明寫進方括號內，run #436 就只剩 deploy
      #  一顆 job、build 矩陣整個沒跑。改動前後都用 python 把這塊 json.loads() 驗過。）
      # llvm 那批（用戶 2026-10-11 點名「六個全部搬去 -git 自動構建」）：一個目錄產七顆
      # split（llvm-libs／llvm／llvm-lit／compiler-rt／lld／lldb／clang），收集與 repo-add
      # 兩步都是 `pkg_dir/*.pkg.tar.zst` 的 glob，所以 split 不需要額外接點。kind:aur 只為
      # 借用回推那步的 `matrix.kind != 'aur'`（pkgver 由上游 HEAD 現算，回推校驗和無意義）；
      # case 首命中即中，走本倉 llvm-git/PKGBUILD，不會去 clone AUR。逐包理由見
      # docs/in-tree-packages.md。
      # crave（2026-10-13）：不是 -git 包，但跟 u1s1-bin／jbr21／qoder-* 同一類「in-tree 維護＋
      # 版號由外部端點驅動」，所以掛在本 workflow（3 小時節拍）。plan 只在「上游 tag ≠ PKGBUILD
      # 的 _pkgver」時才下載算 sha（上游二進位 30MB×2、只發 md5 無簽名），平时无腦一個 API call。
      # 它的 pkgver 是 ${_pkgver/-/.} 算出來的（連字號→點號，pacman 不準 pkgver 含 -），
      # 而 source URL 裡是連字號版，所以 build-packages.yml 需要三個特例：plan 的 crave) case、
      # 改寫步 sed _pkgver=、以及走 in-tree 回推而非 updpkgsums。
      # 以下 packages 是純 JSON 塊，fromJSON 不會剝註解，所以說明只能寫在這裡：
      # · fcitx5-qt 在 AUR 已拆成 qt5/qt6 兩顆（沒有單一的 fcitx5-qt-git），
      # · 本機的 fcitx5-qt 由這兩顆取代。
      # · chinese-addons / rime 鏈上的 AUR 依賴，必須先進矩陣，否則跟 afdko-git
      # · 同一型失敗（容器裡 target not found → Could not resolve all dependencies）。
      # · fcitx5-configtool-git 刻意**不**進矩陣：AUR 那份靜態 pkgver 停在 5.1.2.r1
      # · （比倉庫的 5.1.16 還舊），而且 depends 列了倉庫已不存在 plasma-framework5，
      # · 裝它等於降級 + 必然解析失敗。configtool 改吃倉庫版。
      # · afdko-git 的兩個依賴都不在官方倉庫（本機是從 archlinuxcn / chaotic-aur 裝的），
      # · 容器裡只有官方倉庫 → run #529 就是死在 `target not found: python-cu2qu`。
      # · 必須先讓它們進 feed，順序上跟 afdko-git 同一輪就能解析到。
      # · kvantum-qt4-git 刻意移出矩陣：它 depends `qt4`，而 qt4 不在任何官方倉庫
      # · （本機那顆是從 andontie-aur / arch4edu 裝的），AUR 的 qt4 是 4.8.7 那個年代的東西，
      # · 在 base-devel 容器裡構起來動輒數小時且多半過不了 toolchain。
      # · run #529 的失敗就是 `target not found: qt4`。要這顆請直接從第三方倉庫裝，別走 feed。
      packages: |
        [
          {"key": "dae-git", "repo_name": "dae-git", "variant": "none"},
          {"key": "tar-git", "repo_name": "tar-git", "variant": "none"},
