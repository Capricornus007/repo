          {"key": "pysolfc-git", "repo_name": "pysolfc-git", "variant": "none"},
          {"key": "xlibre-input-libinput-git", "repo_name": "xlibre-input-libinput-git", "variant": "none"},
          {"key": "xlibre-xserver-git", "repo_name": "xlibre-xserver-git", "variant": "none"},
          {"key": "android-ndk-23", "repo_name": "android-ndk-23", "variant": "none"},
