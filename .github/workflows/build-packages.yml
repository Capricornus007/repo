name: Build Pacman Repository (reusable)

# 这是一个「可重用 workflow」：本身不会自己触发，由 build-kernels.yml 和
# build-git-packages.yml 调用，各自传入不同的套件清单和构建频率。
# 打包与发布的全部逻辑只写在这一份文件里，两条流水线共用，避免复制粘贴
# 出现两份逐渐走偏的实现。

on:
  workflow_call:
    inputs:
      packages:
        description: '套件矩阵（JSON 数组，元素含 key / repo_name / variant）'
        required: true
        type: string
      timeout_minutes:
        description: '单个套件的构建超时（分钟）'
        required: false
        type: number
        # 360：Qoder 預下載步驟改成「無限重試直到成功」後，job 級 timeout 是唯一
        # 兜底閘（見「预下载 Qoder 四包的上游源码」）。調值需 ≥ 單檔 190–250MB 在
        # 境外慢鏈路（CN 端點單連線實測 ~48KB/s）下的總下載預算＋編裝時間。
        default: 360

env:
  REPO_RELEASE_TAG: current-repo

jobs:
  build-packages:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.packages) }}

    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: 释放 Runner 磁盘空间
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / || true

      - name: 初始化 Arch Linux 环境
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git jq curl sudo devtools pacman-contrib gnupg github-cli
          # oh-my-pi 的 rust natives（audiopus_sys 等）用 cmake+Ninja generator，
          # AUR PKGBUILD 的 makedepends 漏列 ninja，容器預設沒有 → 補裝
          if [ "${{ matrix.repo_name }}" = 'oh-my-pi-git' ]; then
            pacman -Sy --noconfirm --needed ninja
          fi

          if [ "${{ matrix.repo_name }}" = 'ffmpeg-full-git' ]; then
            # 与维护者本机相同的第三方仓库清单。完整功能版 ffmpeg 的依赖
            # 由这些仓库提供；只有 mpeghdec、quirc、svt-jpeg-xs-git 仍从 AUR 构建。
            # linuxrepos（archlinux.repo.063240.xyz）已移除：域名权威 DNS 挂了
            # （lame delegation），且该仓库里根本没有 ffmpeg 依赖的任何包。
            install -d /etc/pacman.d
            printf '%s\n' \
              'Server = https://geo-mirror.chaotic.cx/$repo/$arch' \
              'Server = https://cdn-mirror.chaotic.cx/$repo/$arch' \
              > /etc/pacman.d/chaotic-mirrorlist
            printf '%s\n' 'Server = https://repo.archlinuxcn.org/$arch' \
              > /etc/pacman.d/archlinuxcn-mirrorlist
            printf '%s\n' \
              'Server = https://repository.arch4edu.org/$arch' \
              'Server = https://mirrors.nju.edu.cn/arch4edu/$arch' \
              > /etc/pacman.d/arch4edu-mirrorlist
            printf '%s\n' \
              'Server = https://ftp.f3l.de/~martchus/$repo/os/$arch' \
              'Server = https://martchus.no-ip.biz/repo/arch/$repo/os/$arch' \
              > /etc/pacman.d/ownstuff-mirrorlist
            cat >> /etc/pacman.conf <<'PACMAN_REPOS'

          [chaotic-aur]
          SigLevel = Never
          Include = /etc/pacman.d/chaotic-mirrorlist
          [archlinuxcn]
          SigLevel = Never
          Include = /etc/pacman.d/archlinuxcn-mirrorlist
          [arch4edu]
          SigLevel = Never
          Include = /etc/pacman.d/arch4edu-mirrorlist
          [ownstuff]
          SigLevel = Never
          Include = /etc/pacman.d/ownstuff-mirrorlist
          PACMAN_REPOS
            pacman -Syu --noconfirm --needed
          fi

          if [ "${{ matrix.kind }}" = 'kde' ] || [ "${{ matrix.kind }}" = 'wayland' ] || [ "${{ matrix.kind }}" = 'aur' ]; then
            # 把自有 junlin03-aur 掛成匿名 pacman 源。矩陣 job 並行，靠它看見
            # 兄弟 job 已發布的 KDE 依賴產物（release 資產公開可取，實測
            # …/current-repo/junlin03-aur.db 與包檔均 HTTP 200）。冷啟動時
            # 依賴尚未發布 → plan 步跳過，靠每小時排程按依賴 DAG 逐層收斂。
            {
              echo ''
              echo '[junlin03-aur]'
              echo 'SigLevel = Never'
              echo "Server = https://github.com/${{ github.repository }}/releases/download/current-repo"
            } >> /etc/pacman.conf
            # 27 個 kde job 同時抓同一個 release 資產端點，GitHub 偶發 500
            # （2026-09-15 冷啟動 kcompletion-git 實測）。重試幾次；仍失敗就
            # 放過——junlin03-aur 沒同步到，plan 步的依賴門檻會把「查無依賴」
            # 判成未就緒而跳過，正好是安全的冷啟動行為，不該讓整個 job 紅。
            for _try in 1 2 3 4 5; do
              # 只同步資料庫：`pacman -Sy <target>` 會把 target 當「要安裝的包名」，
              # 寫 repo 名會恆報 `target not found: junlin03-aur`（2026-09-16 CI 實測
              # 5 次全紅、白燒 74 秒/job，27 個 kde job 並行合計浪費大量 runner）。
              # 這裡要的只是同步 DB，沒有任何要安裝的包，所以不帶目標。
              pacman -Sy --noconfirm && break
              echo "同步 junlin03-aur 失敗（第 ${_try}/5 次），退避重試"
              sleep $(( _try * 5 + RANDOM % 10 ))
            done
            true
          fi

          if [ "${{ matrix.kind }}" = 'kde' ]; then
            # 帶 Python bindings 的 KDE 框架（上游 CMakeLists 預設 BUILD_PYTHON_BINDINGS=ON）
            # 在 configure 要的、以及 build() 生成 bindings 要的，一整套：
            #   configure: find_package(Shiboken6)  → shiboken6（提供 Shiboken6Config.cmake）
            #              find_package(PySide6)    → pyside6（提供 PySide6Config.cmake）
            #   build:     /usr/bin/shiboken6       → shiboken6-generator
            #              python3 -m build         → python-build
            #              setuptools 後端          → python-setuptools
            # AUR 的 makedepends 只有 kguiaddons 列全，kcoreaddons/kwidgetsaddons 一個都沒列，
            # 2026-09-15/16 CI 逐層實測：缺 generator→find_package(Shiboken6) 紅；
            # 補 shiboken6→find_package(PySide6) 紅；全補後 build() 才在
            # 「python3 -m build」因缺 python-build 紅。整套一起預裝；無 bindings 的包多裝無害。
            pacman -S --noconfirm --needed shiboken6 shiboken6-generator pyside6 python-build python-setuptools
          fi

          if [ "${{ matrix.kind }}" = 'tkg' ]; then
            # mesa-tkg 的 customization.cfg 是 _lib32=true，需要 multilib 的 lib32-* 依賴。
            # 容器只有 core/extra、預設 [multilib] 是註解掉的，補一段未註解的進去再同步。
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
            # 必须 -Syu 全量升级（容器镜像自带的是构建快照日的旧库）。
            pacman -Syu --noconfirm
            # ── LLVM 对齐目标机（2026-09-18 实证根因）
            # 产物装在使用者的 Artix 机器上，其 llvm/clang 是 Artix [world-goblins]
            # 的 23.1.1（本机实测 llvm-libs 23.1.1-1，packager ndowens@artixlinux.org），
            # 而 Arch extra 与 Artix [world] 都只有 22.1.8。mesa 在链接期把 LLVM
            # soname 写死成 libLLVM.so.22.1，装到只有 libLLVM.so.23.1 的机器上
            # dlopen 失败 → GLX 初始化崩（2026-09-17 本机 kbreakout/kdeconnect
            # "Could not initialize GLX"、exit 134 即此；当时只能在机器上手放一份
            # 无主 libLLVM.so.22.1 硬解）。加 Artix goblins 源，让容器 llvm/clang
            # 与目标机一致；lib32-* 同源，供 _lib32=true 的 lib32 mesa 使用。
            printf '\n[world-goblins]\nServer = https://artix.wheaton.edu/repos/world-goblins/os/$arch\n\n[lib32-goblins]\nServer = https://artix.wheaton.edu/repos/lib32-goblins/os/$arch\n' >> /etc/pacman.conf
            # wheaton 是唯一承載 world-goblins/lib32-goblins 的 Artix 鏡像
            # （rit/checkdomain/clarkson 實測 404，不承載 goblins）。它推送新包時
            # 有同步瞬間 db 還沒落地 → 404「failed to synchronize all databases」
            # （2026-09-18 04:03 實測；同日 14:xx 已 200）。無第二鏡像可退，
            # 只能重試撐過幾分鐘的同步窗口。
            synced=false
            for attempt in 1 2 3 4 5; do
              if pacman -Sy --noconfirm; then synced=true; break; fi
              echo "goblins 源同步失败（第 ${attempt}/5 次），多半撞上 wheaton 推送窗口，退避重试"
              sleep $(( attempt * 20 ))
            done
            [ "$synced" = true ] || { echo "::error::Artix goblins 源连续 5 次同步失败"; exit 1; }
            pacman -S --noconfirm --needed llvm llvm-libs clang compiler-rt lib32-llvm lib32-llvm-libs lib32-clang
            # 显式打印版本，便于日志核对（llvm-config 来自 Artix 的 llvm 包）
            llvm-config --version
            readlink -f /usr/lib/libLLVM.so
          fi

          # 并行编译 + 多线程压缩。原来只在「非 CachyOS」分支里改 makepkg.conf，
          # 结果最重的 CachyOS 内核是单线程编译的，必然撞 6 小时上限。
          # 直接追加到文件末尾，比 sed 匹配注释行可靠（上游默认值改过好几次）。
          {
            echo ""
            echo "# ---- CI overrides ----"
            echo "MAKEFLAGS=\"-j$(nproc)\""
            echo 'COMPRESSZST=(zstd -c -z -q --threads=0 -)'
            echo 'COMPRESSXZ=(xz -c -z --threads=0 -)'
            # Arch 默认开着 debug，于是每个包都会多出一份 -debug 包。
            # 我们不需要它：没人装，只是白白占 Release 空间和编译时间。
            # OPTIONS+= 而不是直接赋值，保留上游其余默认项（strip/lto/purge 等）。
            echo 'OPTIONS+=(!debug)'
          } >> /etc/makepkg.conf
          # makepkg 用 curl 下载源码，kernel.org 大文件常断连；
          # 设 120s 超时 + 3 次自动重试，再结合下游重试循环足够稳定
          echo 'CURL_OPTIONS="--connect-timeout 30 --max-time 300 --retry 5 --retry-delay 15"' >> /etc/makepkg.conf
          echo "nproc=$(nproc)"

          useradd builder -m || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取对应的套件仓库
        run: |
          set -euo pipefail
          # ffmpeg-full-git / kew-git 直接取 AUR 的 PKGBUILD；
          # oh-my-pi-git 改走 in-tree（本仓库 oh-my-pi-git/ 目录）：AUR 那份照上游
          #   compile-binary.ts 里新加的 `bytecode: true` 编译，而本仓库的非 frozen
          #   `bun install` 会把 yargs（内含 import.meta.resolve）打进 bundle，
          #   bun 的 bytecode 路径带不动活的 import.meta，做出来的 omp 连
          #   `omp --version` 都会立刻 SyntaxError: import.meta is only valid inside
          #   modules（2026-09-15 v18.2.0.r06f2c14b 实测，详见该 PKGBUILD 注释）；
          # xlibre 两个包上游未改，同样直接取 AUR；
          # mpv-git 的打包文件维护在本仓库 mpv-git/ 目录；
          # pysolfc-git / protonvpn-cli-community-git 同理只取各自目录下的 PKGBUILD
          # （protonvpn 的上游 url 改成了 jonasjancarik 的续命 fork，不能取 AUR 版）
          case "${{ matrix.repo_name }}" in
            ffmpeg-full-git|kew-git)
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir ;;
            oh-my-pi-git)
              # 只要 PKGBUILD 一个文件（无 install hook）；pkgver 仍由 PKGBUILD 的
              # pkgver() 在构建时从上游 HEAD 算出，CI 不回推本仓库这份
              mkdir pkg_dir
              curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/master/oh-my-pi-git/PKGBUILD" \
                -o pkg_dir/PKGBUILD ;;
            xlibre-xserver-git|xlibre-input-libinput-git)
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir
              if [ "${{ matrix.repo_name }}" = "xlibre-xserver-git" ]; then
                # AUR PKGBUILD 引用的 xkb/README.compiled 在上游已被挪到
                # Xext/xkeyboard/，不替换的话 package_common() 会 install 报错中断
                sed -i 's|"xkb/README.compiled"|"Xext/xkeyboard/README.compiled"|' pkg_dir/PKGBUILD
                # AUR 版的 common 拆分包只 provides xlibre-xserver-common，而
                # xorg-xwayland 等套件 depends xorg-server-common——补上 provides，
                # 否则装了 xlibre 后这些套件的依赖永远无法满足
                sed -i '/provides=("${_pkgbase}-common=/a\  provides+=("xorg-server-common=${pkgver%%.r*}")' pkg_dir/PKGBUILD
              else
                # AUR 版只 provides xf86-input-libinput，而 xlibre-xserver-git 与
                # xlibre-meta depends 的是 xlibre-input-libinput——不补 provides
                # 的话，yay 升级 xserver 时会报「xlibre-input-libinput-git
                # 不满足依赖」（2026-09 实测踩过）
                sed -i '/^provides=/a\  provides+=("xlibre-input-libinput=${pkgver%%.r*}")' pkg_dir/PKGBUILD
              fi ;;
            pysolfc-git|protonvpn-cli-community-git)
              mkdir pkg_dir
              curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/master/${{ matrix.repo_name }}/PKGBUILD" \
                -o pkg_dir/PKGBUILD ;;
            dae-git)
              # 同 mpv-git：打包文件维护在本仓库 dae-git/ 目录。
              # PKGBUILD 的上游 url 指向维护者自己的 fork（Capricornus007/dae），
              # 不能取 AUR 版
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/dae-git"
              for f in PKGBUILD dae.install; do
                curl -sfL "$base/$f" -o "pkg_dir/$f"
              done ;;
            u1s1-bin)
              # 官方預編譯 TUI（自帶 Node 運行時的便攜 tarball）。PKGBUILD 維護在
              # 獨立倉庫 Capricornus007/u1s1-bin（android-ndk 模式），
              # 版本偵測走 u1s1.io/releases/LATEST，校驗和由 updpkgsums 更新回推
              git clone "https://github.com/${{ github.repository_owner }}/u1s1-bin.git" pkg_dir ;;
            mpv-git)
              # 本 workflow 没有 checkout step（其他包都是 clone 来的），
              # mpv-git 的三个打包文件直接从本仓库 master 分支的 raw URL 抓
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/mpv-git"
              for f in PKGBUILD find-deps.py mpv.install; do
                curl -sfL "$base/$f" -o "pkg_dir/$f"
              done
              chmod +x pkg_dir/find-deps.py ;;
            codex-desktop-git)
              # 打包文件维护在本仓库 codex-desktop-git/ 目录，不再取 AUR：
              # AUR 上游是 zadkiel 的仓，makedepends 没有 npm，而上游
              # install.sh 的 scripts/lib/asar-patch.sh 用
              # "npx --yes @electron/asar" 打补丁（npx 属于 npm 包，nodejs
              # 不提供），ASAR descriptor 激活时 prepare() 直接炸
              # （2026-09-11 三连红，exit 127）。此包的版本由 build 時下載的
              # deb 中的 build-info.json 確定，CI 無法完整重現，因此僅在
              # 發布關卡檢查是否已有相同版本。
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/codex-desktop-git"
              for f in PKGBUILD codex-desktop-git.install LicenseRef-OpenAI-Terms; do
                curl -sfL "$base/$f" -o "pkg_dir/$f"
              done ;;
            element-desktop-nightly-bin)
              # 從本倉庫獲取 PKGBUILD 和腳本。
              # 版本號從 packages.element.io 的 nightly 目錄獲取。
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/element-desktop-nightly-bin"
              for f in PKGBUILD element-desktop-nightly.sh; do
                curl -sfL "$base/$f" -o "pkg_dir/$f"
              done
              chmod +x pkg_dir/element-desktop-nightly.sh ;;
            nashira-git)
              # 從本倉庫獲取 PKGBUILD（in-tree 模式）；源是 Nashira 主倉
              # master HEAD，build 時 gradle 從源碼構建桌面 app image
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/nashira-git"
              curl -sfL "$base/PKGBUILD" -o "pkg_dir/PKGBUILD" ;;
            free-claude-code-git|bash-git|nodejs-better-sqlite3|qalculate-gtk-git|ttf-jetbrains-maple-mono-nf-xx-xx-xx|adguardhome-git)
              # 六個 in-tree 包（本倉同名目錄，PKGBUILD 從用戶 ~/.cache/yay 的本地版
              # 帶過來、保留其改動）。**必須在這裡先攔掉**：下面的通用規則見 '-git$'
              # 就去 clone AUR，而 free-claude-code-git、qalculate-gtk-git 在 AUR 上
              # 根本不存在（或內容不同），adguardhome-git 雖在 AUR 有用戶要的是本地那份
              # （規則 25），clone 到 AUR/錯的 PKGBUILD 會直接紅或拿到非用戶版。
              mkdir pkg_dir
              _it_repo="${{ github.repository }}"
              _it_pkg="${{ matrix.repo_name }}"
              _it_base="https://raw.githubusercontent.com/${_it_repo}/master/${_it_pkg}"
              _it_api="https://api.github.com/repos/${_it_repo}/contents/${_it_pkg}"
              # 連同 PKGBUILD 把目錄內**全部**檔案取進容器：bash-git 的 dot.*/system.*、
              # free-claude-code-git 的 .install 都是 source/install 引用的本地檔，
              # 只抓 PKGBUILD 會讓 makepkg 報「was not found in the build directory」。
              # 用 contents API（帶 github.token，免 60/hr 限流）動態列檔，以後目錄再加
              # 輔助檔也不用改 CI；API 萬一異常（限流 / 非 JSON）就退回只抓 PKGBUILD，
              # 至少維持舊行為，不會把本來能過的 nodejs/ttf/qalculate 也帶崩。
              _it_list=$(curl -sfL -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ github.token }}" "$_it_api" 2>/dev/null \
                | jq -r 'select(type=="array") | .[].name' 2>/dev/null || true)
              if [ -n "$_it_list" ]; then
                for _f in $_it_list; do
                  curl -sfL "$_it_base/$_f" -o "pkg_dir/$_f" \
                    || { echo "::error::抓取 ${_it_pkg}/$_f 失敗"; exit 1; }
                done
              else
                curl -sfL "$_it_base/PKGBUILD" -o "pkg_dir/PKGBUILD"
              fi ;;
            unicode-emoji)
              # in-tree 維護（本倉 unicode-emoji/）：PKGBUILD + license-from-upstream
              # 兩個檔都要取（授權檔是 source 陣列裡的本地檔，缺了 makepkg 直接紅）。
              mkdir pkg_dir
              _ue_base="https://raw.githubusercontent.com/${{ github.repository }}/master/unicode-emoji"
              for _f in PKGBUILD license-from-upstream; do
                curl -sfL "$_ue_base/$_f" -o "pkg_dir/$_f"
              done ;;
            qoder-cli|qoder-cli-cn|qoder-gui-bin|qoder-gui-cn|qoder-ide-bin)
              # Qoder 五包（國際/CN × 命令列/GUI）全部 in-tree 維護在本倉同名目錄，
              # 只有 PKGBUILD 一個檔案：
              #   qoder-cli     國際 CLI，源 qoder-ide.oss-accelerate…/qodercli，
              #                 裝 /usr/bin/qodercli + symlink qoder
              #   qoder-cli-cn  CN CLI，源 static.qoder.com.cn/qoder-cli-cn，
              #                 裝 /usr/bin/qoderclicn + symlink qoder-cn
              #   qoder-gui-bin 國際 GUI（VS Code fork 佈局），裝 /usr/share/qoder-ide
              #   qoder-gui-cn  CN GUI（electron-builder 佈局），裝 /opt/Qoder-CN
              #                 （package() 把上游帶空格的 "Qoder CN" 目錄改名、desktop 同步重寫）
              # 版本與校驗和都由各自官方端點驅動（見 plan 步驟）。不取 AUR：pakrohk
              # 那幾份走 pkgver=latest + prepare() 裡 curl 滾動址，追不了版，國際 CLI
              # 那份甚至固定恆紅（跑官方 install 腳本裝進 ~/.qoder/bin，$srcdir 等不到
              # 檔）；zxp19821005 那份改成 system-electron 佈局，路徑與官方不同。
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/${{ matrix.repo_name }}"
              curl -sfL "$base/PKGBUILD" -o "pkg_dir/PKGBUILD" ;;
            mesa-tkg-git)
              # chaotic-aur 的 tkg mesa（Tk-Glitch 版 = AUR Lone_Wolf 基底 + tkg patches）。
              # 提供 mesa / vulkan-* / lib32-* 全套拆分包。MESA_WHICH_LLVM（build 步設 4 =
              # stable llvm）產生的是 llvm-libs>=8.0.0（無上限）——正是解除 llvm23 sysupgrade
              # 卡點所需（chaotic 舊模板才會 <23.0.0）。PKGBUILD 會 source
              # $_where/customization.cfg，故兩者必須同目錄；llvm32.native 在 source 陣列裡。
              mkdir pkg_dir
              _mesa_base="https://raw.githubusercontent.com/chaotic-aur/packages/main/mesa-tkg-git"
              for _f in PKGBUILD customization.cfg llvm32.native LICENSE; do
                curl -sfL "$_mesa_base/$_f" -o "pkg_dir/$_f"
              done ;;
            wlroots-git|iwgtk-git)
              # 本倉 in-tree 維護的自建包：wlroots-git 是合併 fork
              # （Capricornus007/wlroots hidpi-hdr：HiDPI xprop + HDR metadata，
              # 取代 AUR 的 wlroots-git/-hidpi-xprop-git/-hdr-metadata-git 三個），
              # iwgtk-git 是用戶自建的 AUR 無同名包。取本倉 master 的 PKGBUILD。
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/${{ matrix.repo_name }}"
              curl -sfL "$base/PKGBUILD" -o "pkg_dir/PKGBUILD" ;;
            fcitx5-git)
              # 本倉 in-tree 維護（2026-09-17）：AUR 版 build() 的
              # -DENABLE_SYSTEMD=OFF 打的是不存在的選項名（上游只有
              # USE_SYSTEMD / EVENT_LOOP_BACKEND），等於沒關——CI 容器裝得下
              # systemd，auto 探測永遠命中 sdevent，libFcitx5Utils 就被鏈上
              # libsystemd.so.0（實測 release 資產 5.1.22.r10.gb6497a59-1
              # 如此）。Artix/OpenRC 沒有 libsystemd.so.0，用戶裝完直接
              # "error while loading shared libraries"。in-tree 版改用
              # -DEVENT_LOOP_BACKEND=libuv -DUSE_SYSTEMD=OFF 真正切走 libuv。
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/${{ matrix.repo_name }}"
              curl -sfL "$base/PKGBUILD" -o "pkg_dir/PKGBUILD" ;;
            sway-git)
              # AUR PKGBUILD 用 arch-meson … -D sd-bus-provider=libsystemd 且 sway
              # 上游 meson.build 写死 werror=true：容器 libinput 一旦比 sway 支持的
              # 新（多出枚举值），ipc-json.c 的 switch 触发 -Wswitch → 被 -Werror
              # 抬成硬错误，build() 红（2026-09-18 实测 LIBINPUT_CONFIG_SCROLL_C*）。
              # 加 -Dwerror=false 关掉把警告当错误（meson 命令行选项覆盖项目默认值）。
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir
              sed -i 's/-D sd-bus-provider=libsystemd/-D sd-bus-provider=libsystemd -Dwerror=false/' pkg_dir/PKGBUILD
              grep -n 'arch-meson' pkg_dir/PKGBUILD | head -3 ;;
            waybar-git)
              # AUR PKGBUILD 沒關 systemd，而 waybar 的 meson.build 是
              # `libsystemd = dependency('libsystemd', required: get_option('systemd'))`：
              # 容器（Arch）有 libsystemd → 產物 usr/bin/waybar NEEDED
              # libsystemd.so.0；Artix/OpenRC 沒有這個 so → 裝上直接
              # "error while loading shared libraries: libsystemd.so.0"
              # （2026-09-18 實測 objdump 該包）。加 -Dsystemd=disabled 真正切走，
              # 同時不再安裝 systemd user unit。
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir
              sed -i "/local _meson_args=(/a\\    -Dsystemd=disabled" pkg_dir/PKGBUILD
              grep -n -A3 'local _meson_args=(' pkg_dir/PKGBUILD | head -6 ;;
            i3lock-color-git)
              # AUR 版 makedepends 只有 git，但 configure 默认开 --enable-image
              # 要 gif_lib.h，容器没有 giflib → build() 红（2026-09-17 实测
              # "cannot find the gif_lib.h header"）。补进 makedepends。
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir
              sed -i "s/^makedepends=('git')/makedepends=('git' 'giflib')/" pkg_dir/PKGBUILD ;;
            *)
              # AUR 包或本仓库维护的 -git 包：
              # sway/wlroots/waybar/i3status 家族：-git 取 AUR、穩定版取 Arch
              # 官方 GitLab。之前用完整名字白名單 (^(sway|wlroots|waybar|
              # i3status)-git$) 漏了 swaybg/swayidle/swaylock-git，它們掉進
              # 「clone 本倉自己維護的倉」分支，而那几个倉不存在 → git 索要
              # 憑證 → CI 無 TTY 直接 exit 128（2026-09-17 實測三個 job 同因
              # 紅）。改成只比對家族前綴，家族再加新包不必動這裡。
              if printf '%s' "${{ matrix.repo_name }}" | grep -qE -- '-git$'; then
                git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir
              elif echo "${{ matrix.repo_name }}" | grep -qE '^(sway|wlroots|waybar|i3status)'; then
                # 官方穩定版包（無 -git 後綴）：從 Arch 官方 GitLab 取 PKGBUILD
                mkdir pkg_dir
                _pkgbase="https://gitlab.archlinux.org/archlinux/packaging/packages/${{ matrix.repo_name }}"
                curl -sfL "${_pkgbase}/-/raw/master/PKGBUILD" -o pkg_dir/PKGBUILD
              elif [ "${{ matrix.kind }}" = 'kde' ]; then
                # KDE 家族 -git 包直接取 AUR 的 PKGBUILD（上游未改，無自有 fork）
                git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir
              else
                git clone "https://github.com/${{ github.repository_owner }}/${{ matrix.repo_name }}.git" pkg_dir
              fi ;;
          esac
          git config --global --add safe.directory "$PWD/pkg_dir"

      - name: 检测 ffmpeg-full-git 上游版本
        if: matrix.repo_name == 'ffmpeg-full-git'
        id: ffmpeg_plan
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pkg_dir
          eval "$(bash -c 'source ./PKGBUILD >/dev/null 2>&1; printf "CUR_PKGVER=%q\\nCUR_PKGREL=%q\\nPKGBASE=%q\\n" "$pkgver" "$pkgrel" "${pkgbase:-${pkgname[0]}}"')"

          # 只过滤源码 blob，保留完整提交与标签历史，严格复用 AUR pkgver() 算法。
          git clone --filter=blob:none https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg-version
          latest_pkgver=$(printf '%s.r%s.g%s' \
            "$(git -C /tmp/ffmpeg-version describe --tags --long | awk -F- '{ sub(/^n/, "", $1); print $1 }')" \
            "$(git -C /tmp/ffmpeg-version describe --tags --match N | awk -F- '{ print $2 }')" \
            "$(git -C /tmp/ffmpeg-version rev-parse --short HEAD)")
          echo "当前 PKGBUILD=$CUR_PKGVER，源码目标=$latest_pkgver"

          assets=$(curl -sfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${REPO_RELEASE_TAG}" \
            | jq -r '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -q "^${PKGBASE}-${latest_pkgver}-${CUR_PKGREL}-"; then
            echo "${PKGBASE}-${latest_pkgver}-${CUR_PKGREL} 已在公开 Release 里"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "pkgver=$latest_pkgver" >> "$GITHUB_OUTPUT"

      - name: 构建 ffmpeg-full-git 的 AUR 依赖
        if: matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/aur-deps
          for aur_pkg in mpeghdec quirc svt-jpeg-xs-git; do
            git clone --depth=1 "https://aur.archlinux.org/${aur_pkg}.git" "/build/aur-deps/${aur_pkg}"
            chown -R builder:builder "/build/aur-deps/${aur_pkg}"
            (cd "/build/aur-deps/${aur_pkg}" && su builder -c 'makepkg -si --noconfirm --needed --asdeps')
          done

      - name: 云端编译 ffmpeg-full-git
        if: matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd pkg_dir
          # AUR 快照的 pkgver 可能落后于刚抓取的 FFmpeg HEAD；把检测结果
          # 写回工作区，保证包文件名、元数据与实际源码版本一致。
          sed -i -E "s/^pkgver=.*/pkgver=${{ steps.ffmpeg_plan.outputs.pkgver }}/" PKGBUILD
          chown -R builder:builder .
          su builder -c 'makepkg -s --noconfirm -f --skippgpcheck'
          ls -lh ./*.pkg.tar.zst

      - name: 导入源码签名公钥
        if: matrix.repo_name != 'ffmpeg-full-git'
        run: |
          set -uo pipefail
          cd pkg_dir
          keys=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1; printf "%s\n" "${validpgpkeys[@]:-}"' \
                 | grep -Eo '^[0-9A-Fa-f]{40}$' || true)
          if [ -z "$keys" ]; then
            echo "本套件没有 validpgpkeys，跳过"
            echo "PGP_OK=1" >> "$GITHUB_ENV"
            exit 0
          fi

          export GNUPGHOME=/home/builder/.gnupg
          install -d -o builder -g builder -m 700 "$GNUPGHOME"
          all_ok=1
          for k in $keys; do
            ok=0
            # 1) kernel.org 官方公钥库（HTTPS，不需要 dirmngr，最稳）
            longid="${k: -16}"
            if curl -sfL "https://git.kernel.org/pub/scm/docs/kernel/pgpkeys.git/plain/keys/${longid}.asc" \
                 -o /tmp/key.asc && su builder -c "gpg --batch --import /tmp/key.asc"; then
              ok=1
            fi
            # 2) pacman 自带的 Arch 开发者钥匙圈（heftig 等）
            if [ "$ok" = 0 ] && pacman-key --export "$k" > /tmp/key.asc 2>/dev/null \
                 && [ -s /tmp/key.asc ] && su builder -c "gpg --batch --import /tmp/key.asc"; then
              ok=1
            fi
            # 3) 公共 keyserver
            if [ "$ok" = 0 ]; then
              for ks in hkps://keyserver.ubuntu.com hkps://keys.openpgp.org; do
                if su builder -c "gpg --batch --keyserver $ks --recv-keys $k"; then ok=1; break; fi
              done
            fi
            if [ "$ok" = 1 ]; then
              echo "已匯入 $k"
            else
              echo "::warning::无法导入公钥 $k"
              all_ok=0
            fi
          done
          echo "PGP_OK=$all_ok" >> "$GITHUB_ENV"

      - name: 检测目标版本并决定是否需要构建
        if: matrix.repo_name != 'ffmpeg-full-git'
        id: plan
        env:
          PKG: ${{ matrix.repo_name }}
          VARIANT: ${{ matrix.variant }}
          KIND: ${{ matrix.kind }}
          # mesa-tkg：4 = stable llvm（產生 llvm-libs>=8.0.0 無上限依賴，解 llvm23 卡點）
          MESA_WHICH_LLVM: "4"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd pkg_dir

          skip() { echo "跳过构建：$1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # api.github.com 未认证只有 60 次/小时，Runner 共用出口 IP 时经常直接 403，
          # 所有 API 调用一律带 token（GITHUB_TOKEN 就够，5000 次/小时）
          gh_api() { curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }

          # Qoder 四包共用：把 PKGBUILD 裡的 <name>::…${pkgver}… 模板 URL 展開、
          # 換成新版本號，再與官方 JSON 給的實際 URL 逐字比對。對不上就讓 job 紅——
          # 上游改檔名或改路徑是要人來看的事，靜默出一個 404 的包或讓 makepkg
          # 校驗和全盤失配都很難查（模板本身是 ${pkgver}，sed 只動 pkgver 那行）。
          # 用法：check_url_template source_x86_64 "$官方url"
          check_url_template() {
            local _arr="$1" _want="$2" _got
            _got=$(bash -c "source ./PKGBUILD >/dev/null 2>&1; printf '%s' \"\${${_arr}[0]:-}\"" \
                   | sed -E 's/^[^:]*:://')
            if [ -z "$_got" ]; then
              echo "::error::$PKG 的 PKGBUILD 裡沒有 ${_arr} 條目"
              exit 1
            fi
            _got="${_got//"$CUR_PKGVER"/$TARGET_PKGVER}"
            if [ "$_got" != "$_want" ]; then
              echo "::error::$PKG 的 source URL 模板與官方清單不符（上游改命名了？）"
              echo "  模板解出: $_got"
              echo "  官方 URL: $_want"
              exit 1
            fi
            echo "URL 模板與官方一致：$_got"
          }


          eval "$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                  printf "CUR_PKGVER=%q\nCUR_PKGREL=%q\nCUR_EPOCH=%q\nPKGBASE=%q\n" \
                         "$pkgver" "$pkgrel" "${epoch:-0}" "${pkgbase:-${pkgname[0]}}"')"
          echo "当前 PKGBUILD: pkgbase=$PKGBASE pkgver=$CUR_PKGVER pkgrel=$CUR_PKGREL epoch=$CUR_EPOCH"

          TARGET_PKGVER=""
          TARGET_PKGREL="$CUR_PKGREL"
          CACHY_TAG=""

          case "$PKG" in
            linux-zencjk)
              # 只认 *-zen* 且非 rc 的 tag，再用 sort -V 取最高。
              # 原来取 API 的 .[0]，2026-08-20 那次直接抓到 v7.1.9-lqx1，
              # 结果 zen 的 release 里没有 lqx 补丁，updpkgsums 连 404 五次后静默跳过。
              tags=$(gh_api "https://api.github.com/repos/zen-kernel/zen-kernel/tags?per_page=100" \
                     | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?-zen[0-9]+$' || true)
              [ -n "$tags" ] || skip "拿不到 zen-kernel tag 列表"
              latest_tag=$(printf '%s\n' "$tags" | sed 's/^v//' | sort -V | tail -n1)
              TARGET_PKGVER="${latest_tag%-zen*}.zen${latest_tag##*-zen}"
              ;;

            linux-ltscjk)
              TARGET_PKGVER=$(curl -sfL "https://www.kernel.org/releases.json" \
                | jq -r '.releases[] | select(.version | startswith("6.12.")) | .version' \
                | sort -V | tail -n1)
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 6.12 longterm 版本号"
              ;;

            snd-pcsp-dkms)
              TARGET_PKGVER=$(curl -sfL "https://www.kernel.org/releases.json" | jq -r '.latest_stable.version')
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 latest_stable 版本号"
              ;;

            linux-cachyos-cjktty)
              all_tags=$(gh_api "https://api.github.com/repos/CachyOS/linux/releases?per_page=100" \
                         | jq -r '.[].tag_name | select(test("^cachyos-[0-9]+\\."))' || true)
              [ -n "$all_tags" ] || skip "拿不到 CachyOS/linux release 列表"
              rel_tag=$(printf '%s\n' "$all_tags" | grep -v -- '-rc' | sort -V | tail -n1)
              rc_tag=$(printf '%s\n' "$all_tags" | grep -- '-rc'   | sort -V | tail -n1)
              echo "正式版 tag=$rel_tag / RC tag=$rc_tag"

              rel_base="${rel_tag#cachyos-}"; rel_base="${rel_base%-*}"   # 7.2.0
              rel_series="${rel_base%.*}"                                 # 7.2

              if [ "$VARIANT" = "rc" ]; then
                [ -n "$rc_tag" ] || skip "没有可用的 RC tag"
                rc_base="${rc_tag#cachyos-}"; rc_base="${rc_base%-*}"      # 7.2-rc7
                rc_series="${rc_base%-rc*}"                                # 7.2
                # RC 只有在版本线高于正式版时才有意义。7.2 正式版已发布后，
                # 7.2-rc7 就是废版本，再编三个小时纯属浪费。
                newest=$(printf '%s\n%s\n' "$rc_series" "$rel_series" | sort -V | tail -n1)
                if [ "$rc_series" = "$rel_series" ] || [ "$newest" != "$rc_series" ]; then
                  skip "RC $rc_tag 的版本线 $rc_series 不高于正式版 $rel_series，已被取代"
                fi
                CACHY_TAG="$rc_tag"
                rcver="rc${rc_base##*-rc}"
                TARGET_PKGVER="${rc_series}.${rcver}"
              else
                [ -n "$rel_tag" ] || skip "没有可用的正式版 tag"
                CACHY_TAG="$rel_tag"
                TARGET_PKGVER="$rel_base"
              fi
              # CachyOS 的 tag 尾号即 pkgrel（本地历史产物 7.2.rc6-1 / 7.2.rc6-2 就是这么来的）
              TARGET_PKGREL="${CACHY_TAG##*-}"
              ;;

            kew-git)
              # -git 包：目标 pkgver 完全由上游 HEAD 决定，忠实复刻 PKGBUILD 的 pkgver()
              KEW_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1; printf "%s" "$url"')
              rm -rf /tmp/kew-src
              git clone "$KEW_URL" /tmp/kew-src || skip "clone kew 上游失败"
              kew_tag=$(git -C /tmp/kew-src tag | sort | tail -n1)
              kew_hash=$(git -C /tmp/kew-src rev-parse --short HEAD)
              [ -n "$kew_hash" ] || skip "拿不到 kew 上游 HEAD"
              TARGET_PKGVER=$(printf '%s.%s' "$kew_tag" "$kew_hash" | sed 's/[:\/\-]//g')
              ;;

            mpv-git|oh-my-pi-git|pysolfc-git)
              # -git 包：目标 pkgver 完全由上游 HEAD 决定。
              # 复刻各包 PKGBUILD 的 pkgver()：
              #   mpv-git: git describe --long --tags --abbrev=7 --exclude 'git-release'
              #            | sed 's/\([^-]*-g\)/r\1/;s/-/./g;s/^v//g'  (带 epoch=1)
              #   oh-my-pi-git: git describe --tags --long --abbrev=7
              #            | sed 's/\([^--]*\)-g/r\1/;s/-/./g'
              #   pysolfc-git: git describe --tags --long --abbrev=7 --match 'pysolfc-[0-9]*'
              #            | sed 's/^pysolfc-//;s/\([^-]*-g\)/r\1/;s/-/./g'
              # source 数组元素形如 "git+https://github.com/mpv-player/mpv"：
              # 剥掉 git+ 前缀，去掉可能的 ::branch 片段与尾部注释，容忍没有 .git 后缀
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^git\+//; s/#[^:]*$//; s/^[^:]*:://' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              if [ "$PKG" = "mpv-git" ]; then
                TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --long --tags --abbrev=7 --exclude 'git-release' \
                  | sed 's/\([^-]*-g\)/r\1/;s/-/./g;s/^v//g')
              elif [ "$PKG" = "pysolfc-git" ]; then
                TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --tags --long --abbrev=7 --match 'pysolfc-[0-9]*' \
                  | sed 's/^pysolfc-//; s/\([^-]*-g\)/r\1/; s/-/./g')
              else
                TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --tags --long --abbrev=7 \
                  | sed 's/\([^--]*\)-g/r\1/;s/-/./g')
              fi
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 $PKG 上游版本"
              ;;

            protonvpn-cli-community-git)
              # 目标 pkgver 完全由上游 HEAD 决定。复刻 PKGBUILD 的 pkgver()，
              # 并同样 --exclude fork 自己打的 latest tag，锚定 v3.2.2 这类正式
              # 版本 tag，否则版本号会变成 latest.rN.gXXX
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^git\+//; s/#[^:]*$//; s/^[^:]*:://' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --long --tags --exclude 'latest' \
                | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 $PKG 上游版本"
              ;;

            dae-git)
              # 上游是维护者 fork（Capricornus007/dae）。忠实复刻 PKGBUILD 的
              # pkgver()：sed 三连是 AUR 原版算法，别"顺手简化"成 s/-/./g——
              # 两者对 v2.0.1-10-g5a446e7 的结果一样，但保持逐字一致最保险
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^git\+//; s/#[^:]*$//; s/^[^:]*:://' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --tags --long \
                | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-\([^-]*\)-\([^-]*\)$/.\1.\2/;s/-//')
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 $PKG 上游版本"
              ;;

            adguardhome-git)
              # AdGuardHome -git（前沿 dev）：pkgver() 是 `cd AdGuardHome;
              # git describe --long --abbrev=7 | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g'`。
              # 泛用 -git 探測把源克隆成 ${pkgname%-git}=adguardhome（小寫），與 pkgver() 的
              # `cd AdGuardHome`（大寫目錄名）對不上會 skip，故單獨克隆成 AdGuardHome 復現。
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                  | sed -E 's/^git\+//; s/#[^:]*$//; s/^[^:]*:://' \
                  | grep -E '^https?://' | head -n1)
              rm -rf /tmp/agh-src
              git clone --quiet --filter=blob:none "$SRC_URL" /tmp/agh-src/AdGuardHome \
                || skip "clone AdGuardHome 上游失敗"
              TARGET_PKGVER=$(git -C /tmp/agh-src/AdGuardHome describe --long --abbrev=7 \
                | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 adguardhome-git 上游版本"
              ;;

            xlibre-xserver-git|xlibre-input-libinput-git)
              # 复刻 xlibre PKGBUILD 的 pkgver()：最高 xlibre-*-tag + HEAD 距离它的提交数。
              # 注意 libinput 上游的 tag 前缀是 xlibre-xf86-input-libinput-，
              # 不是包名 xlibre-input-libinput-。
              # source 数组元素形如 "xlibre-xserver::git+https://..."，
              # 先剥 <name>:: 前缀再剥 git+ 前缀，顺序与上面几类相反
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^[^:]*:://; s/^git\+//' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              case "$PKG" in
                xlibre-xserver-git)        tagprefix="xlibre-xserver-" ;;
                xlibre-input-libinput-git) tagprefix="xlibre-xf86-input-libinput-" ;;
              esac
              tag=$(git -C /tmp/gitpkg-src tag -l "${tagprefix}*" --sort=-v:refname | head -n1)
              [ -n "$tag" ] || skip "$PKG 上游没有 ${tagprefix}* tag"
              rev=$(git -C /tmp/gitpkg-src rev-list --count "$tag"..HEAD)
              hash=$(git -C /tmp/gitpkg-src rev-parse --short HEAD)
              TARGET_PKGVER=$(printf '%s.r%s.%s' "${tag#"$tagprefix"}" "$rev" "$hash")
              ;;

            android-ndk-23|android-ndk-27)
              # 固定版本包：pkgver 写死在各自仓库的 PKGBUILD 里，
              # 首次构建入库后 plan 的 release 资产比对应会永远跳过
              TARGET_PKGVER="$CUR_PKGVER"
              ;;

            u1s1-bin)
              # 固定版本包 + 官方 LATEST 檔：版本號直接從 u1s1.io/releases/LATEST
              # 讀（純文字，如 1.9.0）。拿不到時不構建（skip），避免用過期版本
              # 蓋掉已有資產。
              latest=$(curl -fsSL --connect-timeout 15 "https://u1s1.io/releases/LATEST" 2>/dev/null || true)
              case "$latest" in
                *[!0-9.]*|"") skip "拿不到 u1s1.io LATEST 版本號" ;;
              esac
              if [ "$latest" != "$CUR_PKGVER" ]; then
                # 新版本：改寫 PKGBUILD 的 pkgver 由後續步驟處理——但本 case 是
                # 「固定版本包」模式（同 android-ndk），版本改寫在拉取的副本上
                # 由「改写 PKGBUILD」步驟前先 sed。這裡先輸出目標版本。
                TARGET_PKGVER="$latest"
              else
                TARGET_PKGVER="$CUR_PKGVER"
              fi
              ;;

            codex-desktop-git)
              # 版本 = OpenAI deb 版本 + 上游 repo HEAD，pkgver() 构建时才拼装，
              # 无法预知，所以 TARGET_PKGVER 维持现值；而下面的通用资产比对对它
              # 永远不命中（比对的是 PKGBUILD 里写死的旧 pkgver），结果就是
              # 每小时全量重编（下载 deb + 跑 install.sh，1~15 分钟白烧）。
              # 这里直接探测 (deb 版本, 上游 HEAD)，与 release 里最新 codex
              # 资产名记录的组合比对，两者都没变就跳过。探测失败时保持旧行为
              # 照常构建——宁可多编，不可漏编。
              TARGET_PKGVER="$CUR_PKGVER"
              _codex_url=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^[^:]*:://; s/^git\+//' \
                | grep -E '^https?://' | head -n1)
              _codex_head=$(git ls-remote "$_codex_url" HEAD 2>/dev/null \
                | awk '{print substr($1,1,8); exit}')
              _codex_deb=$(curl -fsSL --connect-timeout 15 \
                  "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages" 2>/dev/null \
                | awk '/^Package: chatgpt$/{f=1;next} f&&/^$/{f=0} f&&/^Version:/{print $2; exit}' || true)
              if [ -z "$_codex_head" ] || [ -z "$_codex_deb" ]; then
                echo "::warning::codex 上游探测失败（HEAD/deb 版本拿不到），照常构建"
              else
                _codex_assets=$(gh_api "https://api.github.com/repos/${GH_REPO}/releases/tags/${REPO_RELEASE_TAG}" \
                  | jq -r '.assets[].name' 2>/dev/null || true)
                _codex_last=$(printf '%s\n' "$_codex_assets" \
                  | grep -E "^${PKGBASE}-[0-9].*\.r[0-9]+\.g[0-9a-f]{8}-" \
                  | sort -V | tail -n1)
                if [ -z "$_codex_last" ]; then
                  echo "release 里还没有 codex 资产，照常构建"
                else
                  _codex_last_ver="${_codex_last#${PKGBASE}-}"
                  _codex_last_ver="${_codex_last_ver%%-*}"
                  _codex_last_deb=$(printf '%s' "$_codex_last_ver" | sed -E 's/\.r[0-9]+\.g[0-9a-f]{8}$//')
                  _codex_last_head=$(printf '%s' "$_codex_last_ver" | sed -nE 's/.*\.g([0-9a-f]{8})$/\1/p')
                  if [ "$_codex_deb" = "$_codex_last_deb" ] && [ "$_codex_head" = "$_codex_last_head" ]; then
                    skip "codex 上游未变（deb $_codex_deb / HEAD $_codex_head，已发布 $_codex_last_ver）"
                  fi
                  echo "codex 上游有变：deb $_codex_last_deb -> $_codex_deb / HEAD $_codex_last_head -> $_codex_head"
                fi
              fi
              ;;

            element-desktop-nightly-bin)
              # element-desktop-nightly-bin 版本由日期+流水號組成，如 2026091101。
              # 首選 Element 官方 APT 元数据（纯文本小文件，权威且格式稳定）。
              # pool 目录列表页在 runner 的数据中心 IP 上会被 Cloudflare 挑战页
              # 挡掉，curl -f 失败又被 || true 吞掉，于是每轮都 skip
              # 「拿不到 Element nightly 版本号」——release 里连一个 element
              # 包都没有（2026-09-12 实测定位）。
              latest=$(curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 10 \
                         "https://packages.element.io/debian/dists/default/main/binary-amd64/Packages" 2>/dev/null \
                       | awk '/^Package: element-nightly$/{f=1;next} f&&/^$/{f=0} f&&/^Version:/{print $2; exit}' || true)
              if [ -z "$latest" ]; then
                echo "::warning::APT Packages 读取失败，退回 pool 目录列表页"
                latest=$(curl -fsSL --connect-timeout 15 \
                           "https://packages.element.io/debian/pool/main/e/element-nightly/" 2>/dev/null \
                         | grep -oE 'element-nightly_[0-9]+_amd64\.deb' \
                         | sed -E 's/^element-nightly_([0-9]+)_amd64\.deb$/\1/' \
                         | sort -V | tail -n1 || true)
              fi
              case "$latest" in
                *[!0-9]*|"") skip "拿不到 Element nightly 版本号（APT 元数据与目录页均不可达）" ;;
              esac
              if [ "$latest" != "$CUR_PKGVER" ]; then
                TARGET_PKGVER="$latest"
              else
                TARGET_PKGVER="$CUR_PKGVER"
              fi
              ;;
            nashira-git)
              # 版本 = Nashira 主倉 master HEAD 的 git describe
              # （v0.1.0-74-gb1fcd2b → 0.1.0.r74.gb1fcd2b）。與 ffmpeg-full-git
              # 同款：blob 過濾克隆保留 tags，嚴格復現 PKGBUILD pkgver() 的算法
              rm -rf /tmp/nashira-version
              git clone --filter=blob:none https://github.com/Capricornus007/nashira.git /tmp/nashira-version
              latest_pkgver=$(git -C /tmp/nashira-version describe --tags --long \
                | sed 's/^v//; s/\([^-]*-g\)/r\1/; s/-/./g')
              case "$latest_pkgver" in
                *[!0-9a-zA-Z.+-r]*|"") skip "拿不到 Nashira HEAD 版本号" ;;
              esac
              echo "当前 PKGBUILD=$CUR_PKGVER，源码目标=$latest_pkgver"
              if [ "$latest_pkgver" != "$CUR_PKGVER" ]; then
                TARGET_PKGVER="$latest_pkgver"
              else
                TARGET_PKGVER="$CUR_PKGVER"
              fi
              ;;

            qoder-cli|qoder-cli-cn)
              # Qoder 命令列兩包：官方 channels/manifest.json 同時給版本號與各 arch
              # 校驗和，全程端點驅動。國際與 CN 兩份 manifest 就算版本号相同、sha 也
              # 各異、檔名還差一個 cn（qodercli-* vs qoderclicn-*），必須各讀各的：
              #   國際 https://qoder-ide.oss-accelerate.aliyuncs.com/qodercli/channels/manifest.json
              #   CN   https://static.qoder.com.cn/qoder-cli-cn/channels/manifest.json
              # files[] 裡同一 os 另有 amd64-baseline（無 AVX2 老 CPU）與 *-musl 變體，
              # select 必須用「等於」而不是「開頭是」，否則會抓到 baseline。
              case "$PKG" in
                qoder-cli)    _qcli_manifest="https://qoder-ide.oss-accelerate.aliyuncs.com/qodercli/channels/manifest.json" ;;
                qoder-cli-cn) _qcli_manifest="https://static.qoder.com.cn/qoder-cli-cn/channels/manifest.json" ;;
              esac
              _qcli=$(curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 10 "$_qcli_manifest" 2>/dev/null || true)
              [ -n "$_qcli" ] || skip "拿不到 $PKG 的 channels/manifest.json"
              TARGET_PKGVER=$(printf '%s' "$_qcli" | jq -r '.latest // empty')
              case "$TARGET_PKGVER" in ""|0|*[!0-9.]*) skip "拿不到 $PKG 版本號（=$TARGET_PKGVER）" ;; esac
              _qcli_sha_x=$(printf '%s' "$_qcli" | jq -r '.files[] | select(.os=="linux" and .arch=="amd64") | .sha256' | head -n1)
              _qcli_sha_a=$(printf '%s' "$_qcli" | jq -r '.files[] | select(.os=="linux" and .arch=="arm64") | .sha256' | head -n1)
              _qcli_url_x=$(printf '%s' "$_qcli" | jq -r '.files[] | select(.os=="linux" and .arch=="amd64") | .url' | head -n1)
              _qcli_url_a=$(printf '%s' "$_qcli" | jq -r '.files[] | select(.os=="linux" and .arch=="arm64") | .url' | head -n1)
              printf '%s' "$_qcli_sha_x" | grep -Eq '^[0-9a-fA-F]{64}$' \
                || skip "$PKG manifest 裡沒有 linux/amd64 的 sha256"
              printf '%s' "$_qcli_url_x" | grep -q '^https://' \
                || skip "$PKG manifest 裡沒有 linux/amd64 的 url"
              if printf '%s' "$_qcli_sha_a" | grep -Eq '^[0-9a-fA-F]{64}$'; then
                :
              else
                # 哪天上游不出 arm64 了：只更新 x86_64，aarch64 那行原樣留著並留警告。
                # 矩陣只有 x86_64 runner，不該因此把 job 判紅。
                _qcli_sha_a=""; _qcli_url_a=""
                echo "::warning::$PKG manifest 缺 linux/arm64 的 sha256，PKGBUILD 的 aarch64 校驗和保持原值"
              fi
              check_url_template source_x86_64 "$_qcli_url_x"
              if [ -n "$_qcli_url_a" ]; then check_url_template source_aarch64 "$_qcli_url_a"; fi
              echo "sha_x86=$_qcli_sha_x" >> "$GITHUB_OUTPUT"
              echo "sha_arm=$_qcli_sha_a" >> "$GITHUB_OUTPUT"
              ;;

            nodejs-better-sqlite3|ttf-jetbrains-maple-mono-nf-xx-xx-xx)
              # 這兩個的 source 是 tarball/zip 而非 git 倉：通用探測會拿 source 的第一個
              # https URL 去 git clone，對 .tgz/.zip 必失敗（實測 CLONE-FAIL），會讓整輪
              # 永久跳過。故直接採用 PKGBUILD 寫死的版本 —— 上游更新時由人改 pkgver，
              # 改完 CI 自然看到新版本並重建。
              TARGET_PKGVER="$CUR_PKGVER"
              ;;

            unicode-emoji)
              # Unicode Emoji 資料：18.0 起官方把檔案放進 /Public/<X.Y.Z>/emoji/
              # （一版一目錄，舊寫法 /Public/emoji/<X.Y>/ 已不存在）。列 /Public/ 下的
              # 三段式版本目錄、由新到舊找第一個確實有 emoji-sequences.txt 的，
              # 直接用該目錄名當目標版本 —— 與 PKGBUILD 的 pkgver 同形，不需換算。
              _ue_vers=$(curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 10 \
                           "https://www.unicode.org/Public/" 2>/dev/null \
                         | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
                         | sed -E 's/href="//; s|/"$//' | sort -Vr || true)
              [ -n "$_ue_vers" ] || skip "拿不到 unicode.org /Public/ 的版本目錄清單"
              TARGET_PKGVER=""
              for _v in $_ue_vers; do
                if curl -fsIL --connect-timeout 15 -o /dev/null \
                     "https://www.unicode.org/Public/$_v/emoji/emoji-sequences.txt" 2>/dev/null; then
                  TARGET_PKGVER="$_v"; break
                fi
              done
              case "$TARGET_PKGVER" in ""|*[!0-9.]*) skip "拿不到 Unicode Emoji 版本號（=$TARGET_PKGVER）" ;; esac
              echo "目標 Unicode Emoji 版本：$TARGET_PKGVER"
              ;;

            qoder-ide-bin)
              # Qoder **IDE**（VS Code fork）國際版：IDE 內建更新檢查打的端點就是權威
              # 來源——productVersion 給版本、sha256hash 給該 RPM 的校驗和（2026-09-18
              # 實測與檔案實算 sha256 逐字吻合）。刻意不碰 download.qoder.com 的滾動址
              # （沒有版本號、內容天天換）。
              # 只有 x86_64：linux-arm64 通道是殭屍資料（實測回 name=0.2.7 且 url 指向
              # qoder_amd64.deb），上游沒出 arm64 IDE，PKGBUILD 的 arch 如實只標 x86_64。
              # 2026-09-19：這個端點過去餵給的是 qoder-gui-bin 這個名字，但內容是 IDE
              # 不是桌面端 → 改由 qoder-ide-bin 使用，qoder-gui-bin 換成下面的桌面端。
              _qgui=$(curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 10 \
                        "https://center.qoder.sh/algo/api/update/linux-x64/stable/latest" 2>/dev/null || true)
              [ -n "$_qgui" ] || skip "拿不到 Qoder IDE（國際版）更新端點回應"
              TARGET_PKGVER=$(printf '%s' "$_qgui" | jq -r '.productVersion // .name // empty')
              case "$TARGET_PKGVER" in ""|0|*[!0-9.]*) skip "拿不到 Qoder IDE 版本號（=$TARGET_PKGVER）" ;; esac
              _qgui_sha=$(printf '%s' "$_qgui" | jq -r '.sha256hash // empty')
              _qgui_url=$(printf '%s' "$_qgui" | jq -r '.url // empty')
              printf '%s' "$_qgui_sha" | grep -Eq '^[0-9a-fA-F]{64}$' \
                || skip "Qoder IDE 更新端點沒有可用 sha256hash"
              printf '%s' "$_qgui_url" | grep -q '^https://' \
                || skip "Qoder IDE 更新端點沒有可用 url"
              check_url_template source_x86_64 "$_qgui_url"
              echo "sha_x86=$_qgui_sha" >> "$GITHUB_OUTPUT"
              ;;

            qoder-gui-bin)
              # Qoder **桌面端**（agent workbench）國際版：官方
