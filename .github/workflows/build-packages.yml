name: Build Pacman Repository (reusable)

# 这是一个「可重用 workflow」：本身不会自己触发，由 build-kernels.yml 和
# build-git-packages.yml 调用，各自传入不同的套件清单和构建频率。
# 打包与发布的全部逻辑只写在这一份文件里，两条流水线共用，避免复制粘贴
# 出现两份逐渐走偏的实现。

on:
  workflow_call:
    inputs:
      packages:
        description: '套件矩阵（JSON 数组，元素含 key / repo_name / variant）'
        required: true
        type: string
      timeout_minutes:
        description: '单个套件的构建超时（分钟）'
        required: false
        type: number
        default: 340

env:
  REPO_RELEASE_TAG: current-repo

jobs:
  build-packages:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.packages) }}

    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: 释放 Runner 磁盘空间
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / || true

      - name: 初始化 Arch Linux 环境
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git jq curl sudo devtools pacman-contrib gnupg github-cli
          # oh-my-pi 的 rust natives（audiopus_sys 等）用 cmake+Ninja generator，
          # AUR PKGBUILD 的 makedepends 漏列 ninja，容器預設沒有 → 補裝
          if [ "${{ matrix.repo_name }}" = 'oh-my-pi-git' ]; then
            pacman -Sy --noconfirm --needed ninja
          fi

          if [ "${{ matrix.repo_name }}" = 'ffmpeg-full-git' ]; then
            # 与维护者本机相同的第三方仓库清单。完整功能版 ffmpeg 的依赖
            # 由这些仓库提供；只有 mpeghdec、quirc、svt-jpeg-xs-git 仍从 AUR 构建。
            install -d /etc/pacman.d
            printf '%s\n' \
              'Server = https://geo-mirror.chaotic.cx/$repo/$arch' \
              'Server = https://cdn-mirror.chaotic.cx/$repo/$arch' \
              > /etc/pacman.d/chaotic-mirrorlist
            printf '%s\n' 'Server = https://repo.archlinuxcn.org/$arch' \
              > /etc/pacman.d/archlinuxcn-mirrorlist
            printf '%s\n' \
              'Server = https://repository.arch4edu.org/$arch' \
              'Server = https://mirrors.nju.edu.cn/arch4edu/$arch' \
              > /etc/pacman.d/arch4edu-mirrorlist
            printf '%s\n' \
              'Server = https://ftp.f3l.de/~martchus/$repo/os/$arch' \
              'Server = https://martchus.no-ip.biz/repo/arch/$repo/os/$arch' \
              > /etc/pacman.d/ownstuff-mirrorlist
            printf '%s\n' 'Server = https://archlinux.repo.063240.xyz/$arch/' \
              > /etc/pacman.d/linuxrepos-mirrorlist
            cat >> /etc/pacman.conf <<'PACMAN_REPOS'

          [chaotic-aur]
          SigLevel = Never
          Include = /etc/pacman.d/chaotic-mirrorlist
          [archlinuxcn]
          SigLevel = Never
          Include = /etc/pacman.d/archlinuxcn-mirrorlist
          [arch4edu]
          SigLevel = Never
          Include = /etc/pacman.d/arch4edu-mirrorlist
          [linuxrepos]
          SigLevel = Never
          Include = /etc/pacman.d/linuxrepos-mirrorlist
          [ownstuff]
          SigLevel = Never
          Include = /etc/pacman.d/ownstuff-mirrorlist
          PACMAN_REPOS
            pacman -Syu --noconfirm --needed
          fi

          # 并行编译 + 多线程压缩。原来只在「非 CachyOS」分支里改 makepkg.conf，
          # 结果最重的 CachyOS 内核是单线程编译的，必然撞 6 小时上限。
          # 直接追加到文件末尾，比 sed 匹配注释行可靠（上游默认值改过好几次）。
          {
            echo ""
            echo "# ---- CI overrides ----"
            echo "MAKEFLAGS=\"-j$(nproc)\""
            echo 'COMPRESSZST=(zstd -c -z -q --threads=0 -)'
            echo 'COMPRESSXZ=(xz -c -z --threads=0 -)'
            # Arch 默认开着 debug，于是每个包都会多出一份 -debug 包。
            # 我们不需要它：没人装，只是白白占 Release 空间和编译时间。
            # OPTIONS+= 而不是直接赋值，保留上游其余默认项（strip/lto/purge 等）。
            echo 'OPTIONS+=(!debug)'
          } >> /etc/makepkg.conf
          # makepkg 用 curl 下载源码，kernel.org 大文件常断连；
          # 设 120s 超时 + 3 次自动重试，再结合下游重试循环足够稳定
          echo 'CURL_OPTIONS="--connect-timeout 30 --max-time 300 --retry 5 --retry-delay 15"' >> /etc/makepkg.conf
          echo "nproc=$(nproc)"

          useradd builder -m || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取对应的套件仓库
        run: |
          set -euo pipefail
          # ffmpeg-full-git / kew-git / oh-my-pi-git 直接取 AUR 的 PKGBUILD；
          # xlibre 两个包上游未改，同样直接取 AUR；
          # mpv-git 的打包文件维护在本仓库 mpv-git/ 目录；
          # pysolfc-git / protonvpn-cli-community-git 同理只取各自目录下的 PKGBUILD
          # （protonvpn 的上游 url 改成了 jonasjancarik 的续命 fork，不能取 AUR 版）
          case "${{ matrix.repo_name }}" in
            ffmpeg-full-git|kew-git|oh-my-pi-git)
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir ;;
            xlibre-xserver-git|xlibre-input-libinput-git)
              git clone "https://aur.archlinux.org/${{ matrix.repo_name }}.git" pkg_dir ;;
            pysolfc-git|protonvpn-cli-community-git)
              mkdir pkg_dir
              curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/master/${{ matrix.repo_name }}/PKGBUILD" \
                -o pkg_dir/PKGBUILD ;;
            mpv-git)
              # 本 workflow 没有 checkout step（其他包都是 clone 来的），
              # mpv-git 的三个打包文件直接从本仓库 master 分支的 raw URL 抓
              mkdir pkg_dir
              base="https://raw.githubusercontent.com/${{ github.repository }}/master/mpv-git"
              for f in PKGBUILD find-deps.py mpv.install; do
                curl -sfL "$base/$f" -o "pkg_dir/$f"
              done
              chmod +x pkg_dir/find-deps.py ;;
            *)
              git clone "https://github.com/${{ github.repository_owner }}/${{ matrix.repo_name }}.git" pkg_dir ;;
          esac
          git config --global --add safe.directory "$PWD/pkg_dir"

      - name: 检测 ffmpeg-full-git 上游版本
        if: matrix.repo_name == 'ffmpeg-full-git'
        id: ffmpeg_plan
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pkg_dir
          eval "$(bash -c 'source ./PKGBUILD >/dev/null 2>&1; printf "CUR_PKGVER=%q\\nCUR_PKGREL=%q\\nPKGBASE=%q\\n" "$pkgver" "$pkgrel" "${pkgbase:-${pkgname[0]}}"')"

          # 只过滤源码 blob，保留完整提交与标签历史，严格复用 AUR pkgver() 算法。
          git clone --filter=blob:none https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg-version
          latest_pkgver=$(printf '%s.r%s.g%s' \
            "$(git -C /tmp/ffmpeg-version describe --tags --long | awk -F- '{ sub(/^n/, "", $1); print $1 }')" \
            "$(git -C /tmp/ffmpeg-version describe --tags --match N | awk -F- '{ print $2 }')" \
            "$(git -C /tmp/ffmpeg-version rev-parse --short HEAD)")
          echo "当前 PKGBUILD=$CUR_PKGVER，源码目标=$latest_pkgver"

          assets=$(curl -sfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${REPO_RELEASE_TAG}" \
            | jq -r '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -q "^${PKGBASE}-${latest_pkgver}-${CUR_PKGREL}-"; then
            echo "${PKGBASE}-${latest_pkgver}-${CUR_PKGREL} 已在公开 Release 里"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "pkgver=$latest_pkgver" >> "$GITHUB_OUTPUT"

      - name: 构建 ffmpeg-full-git 的 AUR 依赖
        if: matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/aur-deps
          for aur_pkg in mpeghdec quirc svt-jpeg-xs-git; do
            git clone --depth=1 "https://aur.archlinux.org/${aur_pkg}.git" "/build/aur-deps/${aur_pkg}"
            chown -R builder:builder "/build/aur-deps/${aur_pkg}"
            (cd "/build/aur-deps/${aur_pkg}" && su builder -c 'makepkg -si --noconfirm --needed --asdeps')
          done

      - name: 云端编译 ffmpeg-full-git
        if: matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd pkg_dir
          # AUR 快照的 pkgver 可能落后于刚抓取的 FFmpeg HEAD；把检测结果
          # 写回工作区，保证包文件名、元数据与实际源码版本一致。
          sed -i -E "s/^pkgver=.*/pkgver=${{ steps.ffmpeg_plan.outputs.pkgver }}/" PKGBUILD
          chown -R builder:builder .
          su builder -c 'makepkg -s --noconfirm -f --skippgpcheck'
          ls -lh ./*.pkg.tar.zst

      - name: 导入源码签名公钥
        if: matrix.repo_name != 'ffmpeg-full-git'
        run: |
          set -uo pipefail
          cd pkg_dir
          keys=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1; printf "%s\n" "${validpgpkeys[@]:-}"' \
                 | grep -Eo '^[0-9A-Fa-f]{40}$' || true)
          if [ -z "$keys" ]; then
            echo "本套件没有 validpgpkeys，跳过"
            echo "PGP_OK=1" >> "$GITHUB_ENV"
            exit 0
          fi

          export GNUPGHOME=/home/builder/.gnupg
          install -d -o builder -g builder -m 700 "$GNUPGHOME"
          all_ok=1
          for k in $keys; do
            ok=0
            # 1) kernel.org 官方公钥库（HTTPS，不需要 dirmngr，最稳）
            longid="${k: -16}"
            if curl -sfL "https://git.kernel.org/pub/scm/docs/kernel/pgpkeys.git/plain/keys/${longid}.asc" \
                 -o /tmp/key.asc && su builder -c "gpg --batch --import /tmp/key.asc"; then
              ok=1
            fi
            # 2) pacman 自带的 Arch 开发者钥匙圈（heftig 等）
            if [ "$ok" = 0 ] && pacman-key --export "$k" > /tmp/key.asc 2>/dev/null \
                 && [ -s /tmp/key.asc ] && su builder -c "gpg --batch --import /tmp/key.asc"; then
              ok=1
            fi
            # 3) 公共 keyserver
            if [ "$ok" = 0 ]; then
              for ks in hkps://keyserver.ubuntu.com hkps://keys.openpgp.org; do
                if su builder -c "gpg --batch --keyserver $ks --recv-keys $k"; then ok=1; break; fi
              done
            fi
            if [ "$ok" = 1 ]; then
              echo "已匯入 $k"
            else
              echo "::warning::无法导入公钥 $k"
              all_ok=0
            fi
          done
          echo "PGP_OK=$all_ok" >> "$GITHUB_ENV"

      - name: 检测目标版本并决定是否需要构建
        if: matrix.repo_name != 'ffmpeg-full-git'
        id: plan
        env:
          PKG: ${{ matrix.repo_name }}
          VARIANT: ${{ matrix.variant }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd pkg_dir

          skip() { echo "跳过构建：$1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # api.github.com 未认证只有 60 次/小时，Runner 共用出口 IP 时经常直接 403，
          # 所有 API 调用一律带 token（GITHUB_TOKEN 就够，5000 次/小时）
          gh_api() { curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }


          eval "$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                  printf "CUR_PKGVER=%q\nCUR_PKGREL=%q\nCUR_EPOCH=%q\nPKGBASE=%q\n" \
                         "$pkgver" "$pkgrel" "${epoch:-0}" "${pkgbase:-${pkgname[0]}}"')"
          echo "当前 PKGBUILD: pkgbase=$PKGBASE pkgver=$CUR_PKGVER pkgrel=$CUR_PKGREL epoch=$CUR_EPOCH"

          TARGET_PKGVER=""
          TARGET_PKGREL="$CUR_PKGREL"
          CACHY_TAG=""

          case "$PKG" in
            linux-zencjk)
              # 只认 *-zen* 且非 rc 的 tag，再用 sort -V 取最高。
              # 原来取 API 的 .[0]，2026-08-20 那次直接抓到 v7.1.9-lqx1，
              # 结果 zen 的 release 里没有 lqx 补丁，updpkgsums 连 404 五次后静默跳过。
              tags=$(gh_api "https://api.github.com/repos/zen-kernel/zen-kernel/tags?per_page=100" \
                     | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?-zen[0-9]+$' || true)
              [ -n "$tags" ] || skip "拿不到 zen-kernel tag 列表"
              latest_tag=$(printf '%s\n' "$tags" | sed 's/^v//' | sort -V | tail -n1)
              TARGET_PKGVER="${latest_tag%-zen*}.zen${latest_tag##*-zen}"
              ;;

            linux-ltscjk)
              TARGET_PKGVER=$(curl -sfL "https://www.kernel.org/releases.json" \
                | jq -r '.releases[] | select(.version | startswith("6.12.")) | .version' \
                | sort -V | tail -n1)
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 6.12 longterm 版本号"
              ;;

            snd-pcsp-dkms)
              TARGET_PKGVER=$(curl -sfL "https://www.kernel.org/releases.json" | jq -r '.latest_stable.version')
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 latest_stable 版本号"
              ;;

            linux-cachyos-cjktty)
              all_tags=$(gh_api "https://api.github.com/repos/CachyOS/linux/releases?per_page=100" \
                         | jq -r '.[].tag_name | select(test("^cachyos-[0-9]+\\."))' || true)
              [ -n "$all_tags" ] || skip "拿不到 CachyOS/linux release 列表"
              rel_tag=$(printf '%s\n' "$all_tags" | grep -v -- '-rc' | sort -V | tail -n1)
              rc_tag=$(printf '%s\n' "$all_tags" | grep -- '-rc'   | sort -V | tail -n1)
              echo "正式版 tag=$rel_tag / RC tag=$rc_tag"

              rel_base="${rel_tag#cachyos-}"; rel_base="${rel_base%-*}"   # 7.2.0
              rel_series="${rel_base%.*}"                                 # 7.2

              if [ "$VARIANT" = "rc" ]; then
                [ -n "$rc_tag" ] || skip "没有可用的 RC tag"
                rc_base="${rc_tag#cachyos-}"; rc_base="${rc_base%-*}"      # 7.2-rc7
                rc_series="${rc_base%-rc*}"                                # 7.2
                # RC 只有在版本线高于正式版时才有意义。7.2 正式版已发布后，
                # 7.2-rc7 就是废版本，再编三个小时纯属浪费。
                newest=$(printf '%s\n%s\n' "$rc_series" "$rel_series" | sort -V | tail -n1)
                if [ "$rc_series" = "$rel_series" ] || [ "$newest" != "$rc_series" ]; then
                  skip "RC $rc_tag 的版本线 $rc_series 不高于正式版 $rel_series，已被取代"
                fi
                CACHY_TAG="$rc_tag"
                rcver="rc${rc_base##*-rc}"
                TARGET_PKGVER="${rc_series}.${rcver}"
              else
                [ -n "$rel_tag" ] || skip "没有可用的正式版 tag"
                CACHY_TAG="$rel_tag"
                TARGET_PKGVER="$rel_base"
              fi
              # CachyOS 的 tag 尾号即 pkgrel（本地历史产物 7.2.rc6-1 / 7.2.rc6-2 就是这么来的）
              TARGET_PKGREL="${CACHY_TAG##*-}"
              ;;

            kew-git)
              # -git 包：目标 pkgver 完全由上游 HEAD 决定，忠实复刻 PKGBUILD 的 pkgver()
              KEW_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1; printf "%s" "$url"')
              rm -rf /tmp/kew-src
              git clone "$KEW_URL" /tmp/kew-src || skip "clone kew 上游失败"
              kew_tag=$(git -C /tmp/kew-src tag | sort | tail -n1)
              kew_hash=$(git -C /tmp/kew-src rev-parse --short HEAD)
              [ -n "$kew_hash" ] || skip "拿不到 kew 上游 HEAD"
              TARGET_PKGVER=$(printf '%s.%s' "$kew_tag" "$kew_hash" | sed 's/[:\/\-]//g')
              ;;

            mpv-git|oh-my-pi-git|pysolfc-git)
              # -git 包：目标 pkgver 完全由上游 HEAD 决定。
              # 复刻各包 PKGBUILD 的 pkgver()：
              #   mpv-git: git describe --long --tags --abbrev=7 --exclude 'git-release'
              #            | sed 's/\([^-]*-g\)/r\1/;s/-/./g;s/^v//g'  (带 epoch=1)
              #   oh-my-pi-git: git describe --tags --long --abbrev=7
              #            | sed 's/\([^--]*\)-g/r\1/;s/-/./g'
              #   pysolfc-git: git describe --tags --long --abbrev=7 --match 'pysolfc-[0-9]*'
              #            | sed 's/^pysolfc-//;s/\([^-]*-g\)/r\1/;s/-/./g'
              # source 数组元素形如 "git+https://github.com/mpv-player/mpv"：
              # 剥掉 git+ 前缀，去掉可能的 ::branch 片段与尾部注释，容忍没有 .git 后缀
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^git\+//; s/#[^:]*$//; s/^[^:]*:://' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              if [ "$PKG" = "mpv-git" ]; then
                TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --long --tags --abbrev=7 --exclude 'git-release' \
                  | sed 's/\([^-]*-g\)/r\1/;s/-/./g;s/^v//g')
              elif [ "$PKG" = "pysolfc-git" ]; then
                TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --tags --long --abbrev=7 --match 'pysolfc-[0-9]*' \
                  | sed 's/^pysolfc-//; s/\([^-]*-g\)/r\1/; s/-/./g')
              else
                TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --tags --long --abbrev=7 \
                  | sed 's/\([^--]*\)-g/r\1/;s/-/./g')
              fi
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 $PKG 上游版本"
              ;;

            protonvpn-cli-community-git)
              # 目标 pkgver 完全由上游 HEAD 决定。复刻 PKGBUILD 的 pkgver()，
              # 并同样 --exclude fork 自己打的 latest tag，锚定 v3.2.2 这类正式
              # 版本 tag，否则版本号会变成 latest.rN.gXXX
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^git\+//; s/#[^:]*$//; s/^[^:]*:://' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              TARGET_PKGVER=$(git -C /tmp/gitpkg-src describe --long --tags --exclude 'latest' \
                | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
              [ -n "$TARGET_PKGVER" ] || skip "拿不到 $PKG 上游版本"
              ;;

            xlibre-xserver-git|xlibre-input-libinput-git)
              # 复刻 xlibre PKGBUILD 的 pkgver()：最高 xlibre-*-tag + HEAD 距离它的提交数。
              # 注意 libinput 上游的 tag 前缀是 xlibre-xf86-input-libinput-，
              # 不是包名 xlibre-input-libinput-。
              # source 数组元素形如 "xlibre-xserver::git+https://..."，
              # 先剥 <name>:: 前缀再剥 git+ 前缀，顺序与上面几类相反
              SRC_URL=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                        for s in "${source[@]}"; do printf "%s\n" "$s"; done' \
                | sed -E 's/^[^:]*:://; s/^git\+//' \
                | grep -E '^https?://' | head -n1)
              rm -rf /tmp/gitpkg-src
              git clone "$SRC_URL" /tmp/gitpkg-src || skip "clone $PKG 上游失败"
              case "$PKG" in
                xlibre-xserver-git)        tagprefix="xlibre-xserver-" ;;
                xlibre-input-libinput-git) tagprefix="xlibre-xf86-input-libinput-" ;;
              esac
              tag=$(git -C /tmp/gitpkg-src tag -l "${tagprefix}*" --sort=-v:refname | head -n1)
              [ -n "$tag" ] || skip "$PKG 上游没有 ${tagprefix}* tag"
              rev=$(git -C /tmp/gitpkg-src rev-list --count "$tag"..HEAD)
              hash=$(git -C /tmp/gitpkg-src rev-parse --short HEAD)
              TARGET_PKGVER=$(printf '%s.r%s.%s' "${tag#"$tagprefix"}" "$rev" "$hash")
              ;;

            *)
              echo "未知仓库: $PKG" >&2; exit 1 ;;
          esac

          echo "目标版本: $TARGET_PKGVER-$TARGET_PKGREL"

          # 真正的「要不要构建」判据：产物是否已经发布到 release。
          # 原来靠 pkgver 字符串比对，CachyOS 那条 (rc 的 7.2 != pkgver 7.2.0) 永远为真，
          # 于是每天重编两个完整内核，天天撞上限。
          #
          # epoch 包（mpv-git epoch=1）的资产名是 mpv-git-1.0.41.0-…——makepkg 拼出的
          # 「1:0.41.0…」里的冒号在上传前被统一换成了点号。比对必须带上「1.」前缀，
          # 否则永远匹配不上，每个整点都会白编一次。
          EPOCH_PART=""
          if [ "$CUR_EPOCH" != "0" ]; then EPOCH_PART="${CUR_EPOCH}."; fi
          assets=$(gh_api "https://api.github.com/repos/${GH_REPO}/releases/tags/${REPO_RELEASE_TAG}" \
                   | jq -r '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -q "^${PKGBASE}-${EPOCH_PART}${TARGET_PKGVER}-${TARGET_PKGREL}-"; then
            skip "${PKGBASE}-${EPOCH_PART}${TARGET_PKGVER}-${TARGET_PKGREL} 已在 release 里"
          fi

          {
            echo "build=true"
            echo "pkgver=$TARGET_PKGVER"
            echo "pkgrel=$TARGET_PKGREL"
            echo "cachy_tag=$CACHY_TAG"
            echo "pkgbase=$PKGBASE"
          } >> "$GITHUB_OUTPUT"

      - name: 云端编译 protonvpn 的 AUR 依赖
        if: matrix.repo_name == 'protonvpn-cli-community-git' && steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/pv-deps
          # python-pythondialog 已从官方仓库移除，AUR 上的 proton 两件套也远落后
          # 于 fork pyproject 的要求，但它们在哪儿都无处可装——这里只求编出来
          # 满足 makepkg 的依赖解析；用户机器上实际用的是自己装的较新版本。
          for aur_pkg in python-pythondialog python-proton-core python-proton-vpn-api-core; do
            rm -rf "/build/pv-deps/${aur_pkg}"
            git clone --depth=1 "https://aur.archlinux.org/${aur_pkg}.git" "/build/pv-deps/${aur_pkg}"
            chown -R builder:builder "/build/pv-deps/${aur_pkg}"
            (cd "/build/pv-deps/${aur_pkg}" \
              && su builder -c 'makepkg -si --noconfirm --needed --asdeps --skippgpcheck')
          done

      - name: 云端编译 xlibre-input-libinput-git 依赖的 xserver 拆分包
        if: matrix.repo_name == 'xlibre-input-libinput-git' && steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/xlibre-server
          git clone "https://aur.archlinux.org/xlibre-xserver-git.git" /build/xlibre-server/xlibre-xserver-git
          chown -R builder:builder /build/xlibre-server
          cd /build/xlibre-server/xlibre-xserver-git
          # 驱动编译只需要 server/common/devel 三个拆分包，xvfb/xephyr/xnest 用不上，
          # bootstrap 用户点名不要——--pkg 只打包要装的三个
          su builder -c 'makepkg -s --noconfirm -f \
            --pkg xlibre-xserver-git,xlibre-xserver-common-git,xlibre-xserver-devel-git'
          # AUR 的 xlibre-xserver-git 自带循环依赖：server 拆分包 depends
          # xlibre-input-libinput（正是本 job 要编的驱动）。容器里装它时声明
          # 假定已满足即可，用户机器上两者都在我们自己的仓库里，不冲突。
          pacman -U --noconfirm --needed --asdeps \
            --assume-installed xlibre-input-libinput \
            ./xlibre-xserver{,-common,-devel}-git-*.pkg.tar.zst

      - name: 改写 PKGBUILD（版本、config、cjktty 补丁）
        if: matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true'
        env:
          PKG: ${{ matrix.repo_name }}
          VARIANT: ${{ matrix.variant }}
          NEW_PKGVER: ${{ steps.plan.outputs.pkgver }}
          NEW_PKGREL: ${{ steps.plan.outputs.pkgrel }}
          CACHY_TAG: ${{ steps.plan.outputs.cachy_tag }}
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd pkg_dir
          cp PKGBUILD /tmp/PKGBUILD.orig
          gh_api() { curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # 只有使用者点名的这两个内核要强制改 config；ltscjk / dkms 套件保持原样
          case "$PKG" in linux-zencjk|linux-cachyos-cjktty) INJECT=1 ;; *) INJECT=0 ;; esac

          # ---------- 共用：把 CJK + dae 需要的内核选项强制写进 config ----------
          # 用「先删同名行再追加」而不是单纯 >> ，避免 config 里出现
          # 「# CONFIG_X is not set」和「CONFIG_X=y」两行并存。
          # 注意：CONFIG_NET_SCH_CLSACT / CONFIG_BPF_TC 在 mainline 并不存在
          # （clsact 由 NET_SCH_INGRESS 提供，模块别名 sch_clsact），
          # 照写不会报错但会被 kconfig 丢掉，所以额外补上真正生效的符号。
          if [ "$INJECT" = 1 ]; then
          {
            echo ''
            echo '# ==== injected by build-repo.yml (CI only, never committed) ===='
            echo '_ci_force_config() {'
            echo '  local _cfg="$1" _opt'
            echo "  if ! grep -q 'FONT_CJK_16x16' lib/fonts/Kconfig 2>/dev/null; then"
            echo '    echo "错误：cjktty 补丁没有套用成功（lib/fonts/Kconfig 找不到 FONT_CJK_16x16）" >&2'
            echo '    return 1'
            echo '  fi'
            echo '  for _opt in CONFIG_FONT_CJK_16x16 CONFIG_FONT_CJK_32x32 \'
            echo '              CONFIG_NET_CLS_ACT CONFIG_NET_CLS_BPF \'
            echo '              CONFIG_NET_SCH_CLSACT CONFIG_BPF_TC \'
            echo '              CONFIG_NET_SCH_INGRESS CONFIG_NET_ACT_BPF \'
            echo '              CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_DEBUG_INFO_BTF; do'
            echo '    sed -i -E "/^(# )?${_opt}[ =]/d" "$_cfg"'
            echo "    printf '%s=y\\n' \"\$_opt\" >> \"\$_cfg\""
            echo '  done'
            echo '  echo "已强制写入 CJK 字体 + dae/BPF 内核选项"'
            echo '}'
          } >> PKGBUILD
          # 在 prepare() 里 `cp ../config .config` 之前插入调用（此时补丁已套用完）
          sed -i -E 's|^([[:space:]]*)cp \.\./config \.config$|\1_ci_force_config ../config\n&|' PKGBUILD
          grep -n '_ci_force_config ../config' PKGBUILD
          fi

          case "$PKG" in
            linux-zencjk)
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              # Arch 的 linux-zen config 按 <pkgver>-<pkgrel> 打 tag；没有对应 tag 时退回 main
              # PKGBUILD 里原本写的是 ${pkgver}-${pkgrel} 模板，能解析就别动它，
              # 否则会把写死的 tag 提交回 linux-zencjk 仓库，本地 yay 也跟着受害。
              cfg_tag="${NEW_PKGVER}-${NEW_PKGREL}"
              if curl -sfI "https://gitlab.archlinux.org/archlinux/packaging/packages/linux-zen/-/raw/${cfg_tag}/config.x86_64" >/dev/null; then
                echo "Arch gitlab tag ${cfg_tag} 存在，沿用 PKGBUILD 原本的模板"
              else
                echo "::warning::Arch gitlab 还没有 tag ${cfg_tag}，本次临时用 main 分支的 config，且不回推 PKGBUILD"
                sed -i -E "s|(config::https://gitlab\\.archlinux\\.org/archlinux/packaging/packages/linux-zen/-/raw/)[^/]+(/config\\.x86_64)|\\1main\\2|" PKGBUILD
                touch /tmp/skip_push
              fi
              grep -n 'gitlab.archlinux.org' PKGBUILD

              # cjktty 补丁：只在「版本线变了」时才改 URL，同一条线上不动已验证过的钉子
              cur_patch=$(grep -oE 'cjktty-[0-9]+\.[0-9]+(\.[0-9]+)?\.patch' PKGBUILD | head -n1 || true)
              new_series="${NEW_PKGVER%.*}"; new_series="${new_series%.*}"
              cur_series=$(echo "$cur_patch" | sed -E 's/^cjktty-([0-9]+\.[0-9]+).*/\1/')
              if [ -n "$cur_patch" ] && [ "$cur_series" != "$new_series" ]; then
                cand=$(gh_api "https://api.github.com/repos/bigshans/cjktty-patches/contents/v${new_series%%.*}.x" \
                       | jq -r '.[].name' | grep -E "^cjktty-${new_series//./\\.}(\.[0-9]+)?\.patch$" | sort -V | tail -n1 || true)
                if [ -n "$cand" ]; then
                  echo "cjktty 补丁 $cur_patch -> $cand（版本线 $cur_series -> $new_series）"
                  sed -i "s|$cur_patch|$cand|" PKGBUILD
                else
                  echo "::warning::bigshans/cjktty-patches 里找不到 $new_series 的补丁，仍用 $cur_patch"
                fi
              fi
              ;;

            linux-ltscjk)
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              # cjktty 补丁按版本线取仓库里最新的一份。
              # 教训：6.12.104 在 bit_cursor() 里加了字形索引夹紧，钉死在
              # cjktty-6.12.101.patch 上会 hunk #5 FAILED，prepare() 直接中断。
              # 这里不做「套不上就跳过」，套不上就让 job 红掉——宁可缺一次包，
              # 也不要出一颗没有 CJK 字体的内核。
              lts_series=$(echo "$NEW_PKGVER" | cut -d. -f1,2)
              lts_esc="${lts_series//./\\.}"
              cur_patch=$(grep -oE 'cjktty-[0-9]+\.[0-9]+(\.[0-9]+)?\.patch' PKGBUILD | head -n1 || true)
              newest=$(gh_api "https://api.github.com/repos/${REPO_OWNER}/cjktty-patches/contents/v${lts_series%%.*}.x" \
                       | jq -r '.[].name' \
                       | grep -E "^cjktty-${lts_esc}(\.[0-9]+)?\.patch$" | sort -V | tail -n1 || true)
              if [ -z "$newest" ]; then
                echo "::warning::cjktty-patches 里找不到 $lts_series 线的补丁，仍用 ${cur_patch:-原样}"
              elif [ -n "$cur_patch" ] && [ "$newest" != "$cur_patch" ]; then
                echo "cjktty 补丁 $cur_patch -> $newest"
                sed -i "s|$cur_patch|$newest|" PKGBUILD
              else
                echo "cjktty 补丁已是最新：${cur_patch:-?}"
              fi
              ;;

            snd-pcsp-dkms)
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              ;;

            linux-cachyos-cjktty)
              tag_part="${CACHY_TAG#cachyos-}"
              base="${tag_part%-*}"
              if [ "$VARIANT" = "rc" ]; then
                series="${base%-rc*}"
                rcver="rc${base##*-rc}"
                sed -i "s/^_major=.*/_major=$series/"    PKGBUILD
                sed -i "s/^_minor=.*/#_minor=/"          PKGBUILD
                sed -i "s/^#_rcver=.*/_rcver=$rcver/; s/^_rcver=.*/_rcver=$rcver/" PKGBUILD
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/config"
              else
                case "$base" in
                  *.*.*) series="${base%.*}"; minor="${base##*.}" ;;
                  *)     series="$base";      minor="0" ;;
                esac
                sed -i "s/^_major=.*/_major=$series/"  PKGBUILD
                sed -i "s/^_minor=.*/_minor=$minor/"   PKGBUILD
                sed -i "s/^_rcver=.*/#_rcver=/"        PKGBUILD
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/config"
              fi
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/"          PKGBUILD
              sed -i "s/^pkgrel=.*/pkgrel=$NEW_PKGREL/"          PKGBUILD
              sed -i "s/^_tagrel=.*/_tagrel=${CACHY_TAG##*-}/"   PKGBUILD
              # _srcname 直接用 tag：tarball 就叫 <tag>.tar.gz，不必再拼一遍
              sed -i "s/^_srcname=.*/_srcname=$CACHY_TAG/"       PKGBUILD

              # 「根据情况」挑 config：CachyOS 两个打包目录的版本线不一定跟得上我们要构建的 tag
              # （现状：linux-cachyos 还停在 7.1.8，而 CachyOS/linux 的 release tag 已经是 7.2.0）。
              # 拿错版本线的 config 只会让 make olddefconfig 用默认值填一大堆新符号，
              # 编得出来但不是本意，所以优先挑版本线对得上的那一份。
              _cfg_major() {
                curl -sfL "https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/$1/PKGBUILD" \
                  | sed -nE 's/^_major=([0-9.]+).*/\1/p' | head -n1
              }
              rel_maj=$(_cfg_major linux-cachyos || true)
              rc_maj=$(_cfg_major linux-cachyos-rc || true)
              echo "CachyOS 打包目录版本线：linux-cachyos=${rel_maj:-?}  linux-cachyos-rc=${rc_maj:-?}  本次要=$series"
              if [ -n "$rel_maj" ] && [ "$series" = "$rel_maj" ]; then
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/config"
              elif [ -n "$rc_maj" ] && [ "$series" = "$rc_maj" ]; then
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/config"
              else
                echo "::warning::CachyOS 两个打包目录都不是 $series 线，沿用默认 $config_url"
              fi

              echo "下载 config: $config_url"
              curl -sfL -o config "$config_url"
              grep -m1 'Kernel Configuration' config || true

              # cjktty 补丁：优先 cjktty-<series>.patch，没有就退到同线最高的 -rcN
              avail=$(gh_api "https://api.github.com/repos/Capricornus007/cjktty-patches/contents/v${series%%.*}.x" \
                      | jq -r '.[].name' || true)
              esc="${series//./\\.}"
              pick=$(printf '%s\n' "$avail" | grep -E "^cjktty-${esc}(\.[0-9]+)?\.patch$" | sort -V | tail -n1 || true)
              [ -n "$pick" ] || pick=$(printf '%s\n' "$avail" | grep -E "^cjktty-${esc}-rc[0-9]+\.patch$" | sort -V | tail -n1 || true)
              [ -n "$pick" ] || { echo "错误：cjktty-patches 里找不到 $series 的补丁"; exit 1; }
              echo "选用 cjktty 补丁: $pick"
              curl -sfL -o 0001-cjktty.patch \
                "https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master/v${series%%.*}.x/$pick"
              sed -i -E 's|^[[:space:]]*"\$\{_cjktty_source\}/v[0-9]+\.x/cjktty-[^"]+\.patch"[[:space:]]*$|    "0001-cjktty.patch"|' PKGBUILD
              curl -sfL -o cjktty-add-cjk32x32-font-data.patch \
                "https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master/cjktty-add-cjk32x32-font-data.patch"
              sed -i -E 's|^[[:space:]]*"\$\{_cjktty_source\}/cjktty-add-cjk32x32-font-data\.patch"[[:space:]]*$|    "cjktty-add-cjk32x32-font-data.patch"|' PKGBUILD
              ;;
          esac

          echo "==== PKGBUILD 版本区 ===="
          grep -nE '^(pkgver|pkgrel|_major|_minor|_rcver|_tagrel|_srcname)=' PKGBUILD || true

      - name: 更新校验和并回推 PKGBUILD
        if: matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true' && matrix.repo_name != 'linux-cachyos-cjktty' && matrix.repo_name != 'kew-git' && matrix.repo_name != 'mpv-git' && matrix.repo_name != 'oh-my-pi-git' && matrix.repo_name != 'pysolfc-git' && matrix.repo_name != 'protonvpn-cli-community-git' && matrix.repo_name != 'xlibre-xserver-git' && matrix.repo_name != 'xlibre-input-libinput-git'
        env:
          PKG: ${{ matrix.repo_name }}
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          cd pkg_dir
          chown -R builder:builder .
          # 优先从 kernel-sources-cache 下载 tarball（GitHub CDN 稳定）
          # 文件若已存在，updpkgsums 会跳过下载，只算校验和
          CACHE_REPO=Capricornus007/kernel-sources-cache
          for url in $(bash -c 'source PKGBUILD >/dev/null 2>&1; printf "%s\n" "${source[@]}"'); do
            case "$url" in
              https://www.kernel.org/pub/linux/kernel/*.tar.xz)
                fname="${url##*/}"
                if [ -f "$fname" ]; then
                  echo "✅ $fname 已存在，跳过缓存"
                  continue
                fi
                echo "尝试从缓存下载 $fname ..."
                gh release download "kernel-sources" --repo "$CACHE_REPO" -p "$fname" -D . 2>/dev/null || true
                if [ -f "$fname" ]; then
                  echo "✅ 从缓存成功下载 $fname ($(stat -c%s "$fname") 字节)"
                fi
                ;;
            esac
          done
          # kernel.org 偶尔会 reset 大文件的 HTTP/2 连接，删掉半截文件重试。
          # 注意：第一次不能删——上面可能刚从 kernel-sources-cache 拿到完整文件。
          sums_updated=false
          for attempt in 1 2 3 4 5; do
            [ "$attempt" -eq 1 ] || rm -f linux-*.tar.xz linux-*.tar.xz.part
            rm -f linux-*.tar.xz.part
            if su builder -c "updpkgsums"; then sums_updated=true; break; fi
            echo "更新校验和失败（第 ${attempt}/5 次），稍后重试"
            sleep $((attempt * 30))
          done
          if [ "$sums_updated" != "true" ]; then
            echo "::error::无法可靠下载新源码，本次不构建"
            exit 1
          fi
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

          # 回推时不能带上 CI 注入的 _ci_force_config，用原始 PKGBUILD 重放版本改动
          cp PKGBUILD /tmp/PKGBUILD.ci
          if [ -f /tmp/skip_push ]; then
            echo "本次改动含临时性内容，不回推 PKGBUILD"
          else
            sed -i '/^# ==== injected by build-repo\.yml/,$d' PKGBUILD
            sed -i -E '/^[[:space:]]*_ci_force_config \.\.\/config$/d' PKGBUILD
            printf '%s\n' "$(cat PKGBUILD)" > PKGBUILD   # 去掉注入留下的尾端空行
            git add PKGBUILD .SRCINFO
            git commit -m "chore: auto update PKGBUILD & .SRCINFO" || true
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO_OWNER}/${PKG}.git" HEAD || true
          fi
          # 推完再把注入版换回来给 makepkg 用
          cp /tmp/PKGBUILD.ci PKGBUILD
          chown -R builder:builder .

      - name: 云端编译 `.pkg.tar.zst`
        if: matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true'
        run: |
          set -uo pipefail
          cd pkg_dir
          chown -R builder:builder .
          flags="-s --noconfirm -f"
          if [ "${{ matrix.repo_name }}" = "linux-cachyos-cjktty" ]; then
            # CachyOS 的 config / 补丁是 CI 现抓的，校验和对不上，跳过完整性检查
            flags="$flags --skipinteg"
          elif [ "${PGP_OK:-1}" != "1" ]; then
            echo "::warning::有公钥没导入成功，本次跳过 PGP 校验（校验和仍然检查）"
            flags="$flags --skippgpcheck"
          fi
          if [ "${{ matrix.repo_name }}" = "xlibre-xserver-git" ]; then
            # 拆分打包里带一个 bootstrap 变体，用户点名不要；--pkg 只出
            # 截图点名的六个子包
            flags="$flags --pkg=xlibre-xserver-git,xlibre-xserver-common-git,xlibre-xserver-devel-git,xlibre-xserver-xephyr-git,xlibre-xserver-xnest-git,xlibre-xserver-xvfb-git"
          fi
          echo "makepkg $flags"
          su builder -c "makepkg $flags"
          ls -lh ./*.pkg.tar.zst

      - name: 暂存构建好的 `.pkg.tar.zst` 产物
        if: (matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true') || (matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true')
        run: |
          set -euo pipefail
          # 兼底：makepkg.conf 里的 OPTIONS+=(!debug) 已经按住了 debug 包，但若哪个
          # PKGBUILD 自己写了 options=(debug)，它的优先级更高。这里直接删掉，
          # 保证 -debug 包永远不会进 artifact 和 Release。
          # 用 .PKGINFO 里的真实包名判定，而不是拿文件名匆匆匹配 *-debug-*，
          # 免得误伤将来可能出现的、名字里恰好带 debug 字样的正常包。
          for f in pkg_dir/*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            name=$(pacman -Qp "$f" 2>/dev/null | awk 'NR==1{print $1}' || true)
            case "$name" in *-debug)
              echo "丢弃 debug 包: $f"
              rm -f "$f"
              ;;
            esac
          done
          # epoch 包（如 mpv-git-1:0.41.0-…）文件名含冒号，GitHub artifact
          # 路径禁止 ':' → 上传前把冒号换成点号；repo-add 读 .PKGINFO，
          # 文件名不影响 repo.db 的版本记录，pacman -U 也不受影响。
          for f in pkg_dir/*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            case "$f" in *:*)
              # 注意：bash 的 ${f//:/./} 会把 ':' 替换成 './'（实测），
              # 目标路径多出斜杠导致 mv 失败；改用 sed 逐字替换。
              new=$(printf '%s' "$f" | sed 's/:/./g')
              mv "$f" "$new"
              echo "renamed: $f -> $new"
              ;;
            esac
          done
      - name: 上传产物到 artifact
        if: (matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true') || (matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.key }}
          path: pkg_dir/*.pkg.tar.zst
          if-no-files-found: error

  deploy-repo:
    needs: build-packages
    if: always() && needs.build-packages.result != 'cancelled'
    runs-on: ubuntu-latest
    # 内核流水线和 -git 流水线都会跑到这一步，而这一步是「下载数据库 → 追加
    # 条目 → 上传覆盖」。两边同时进行的话，后上传的那份会把先上传的条目抹掉，
    # 包文件还在 Release 里但数据库不认，pacman 就看不见。
    #
    # group 里刻意不含 github.workflow：两条流水线必须落进同一个组，GitHub 才
    # 会让它们排队而不是并行。cancel-in-progress 关掉，等前一个写完再写。
    concurrency:
      group: deploy-repo-database
      cancel-in-progress: false
    permissions:
      contents: write
    container:
      image: archlinux:base-devel

    steps:
      - name: 安装工具
        run: pacman -Syu --noconfirm github-cli

      - name: 下载所有子 Job 构建好的 `.pkg.tar.zst`
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifact-downloads
          pattern: pkg-*
          merge-multiple: true

      - name: 检查是否有构建产物
        id: check_artifacts
        run: |
          mkdir -p artifact-downloads
          if [ -z "$(find artifact-downloads -name '*.pkg.tar.zst' -print -quit 2>/dev/null)" ]; then
            echo "没有构建产物，跳过部署"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          else
            find artifact-downloads -name '*.pkg.tar.zst' -printf '%f\n'
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          fi

      - name: 整合并更新 repo.db 数据库
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        id: build_db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          find artifact-downloads -name "*.pkg.tar.zst" -exec cp {} deploy/ \;
          cd deploy
          # 记下旧数据库是否真的拿到了。拿不到时 repo-add 会凭空建一个只含本轮
          # 产物的新库，那样下面的清理步骤会把 Release 里其他包全判成垃圾。
          if gh release download "$REPO_RELEASE_TAG" --repo "${{ github.repository }}" \
               -p "junlin03-aur.db*" -p "junlin03-aur.files*" --clobber \
             && [ -s junlin03-aur.db.tar.gz ]; then
            echo "db_restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没能取回旧数据库，本轮只做增量添加，不清理任何旧资产"
            echo "db_restored=false" >> "$GITHUB_OUTPUT"
          fi
          # 刻意不用 -n/--new：它看到同名同版本就整条跳过，连依赖变了也不管。
          # mpv-git 就是这么坏的——PKGBUILD 把 jack2 换成虚拟包 jack 后重编，
          # 包文件更新了，数据库条目还停在旧的一次构建，pacman 于是仍想装 jack2，
          # 跟本机的 pipewire-jack 撞成无解冲突。
          # -p/--prevent-downgrade 保留了真正需要的那道保护：版本变低时拒绝写入。
          repo-add -R -p junlin03-aur.db.tar.gz ./*.pkg.tar.zst

          # 历史遗留的 -debug 条目要从库里摘掉，否则 pacman 仍会列出它们，
          # 而对应的包文件马上就要被清理掉，变成「看得见装不上」。
          mapfile -t debug_entries < <(
            tar -xzOf junlin03-aur.db.tar.gz --wildcards '*/desc' 2>/dev/null \
              | awk '/^%NAME%$/{getline;print}' | grep -- '-debug$' || true)
          if [ "${#debug_entries[@]}" -gt 0 ]; then
            echo "从数据库摘除 debug 条目: ${debug_entries[*]}"
            repo-remove junlin03-aur.db.tar.gz "${debug_entries[@]}"
          fi

          # repo-add 会为数据库留下 *.old 本地备份；它们不应成为仓库入口或 Release 资产。
          rm -f junlin03-aur.db.tar.gz.old junlin03-aur.files.tar.gz.old
          ls -lh

      - name: 部署至 GitHub Releases
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: current-repo
          name: "Custom Personal Repository"
          prerelease: false
          files: |
            deploy/*.pkg.tar.zst
            deploy/junlin03-aur.db*
            deploy/junlin03-aur.files*

      - name: 清理旧版本与多余的包资产
        if: steps.check_artifacts.outputs.has_artifacts == 'true' && steps.build_db.outputs.db_restored == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 以刚上传的数据库为唯一准绳：%FILENAME% 列出的才是 pacman 能看见的包，
          # 其余 .pkg.tar.zst 资产全是旧版本或已摘除的 debug 包，白占空间。
          # 这比「只看本轮构建了哪些包名」可靠：哪轮清理漏了，下一轮会自动补上。
          mapfile -t db_files < <(
            tar -xzOf deploy/junlin03-aur.db.tar.gz --wildcards '*/desc' \
              | awk '/^%FILENAME%$/{getline;print}')
          if [ "${#db_files[@]}" -eq 0 ]; then
            echo "::error::数据库里一个 %FILENAME% 都读不到，为安全起见不清理"
            exit 1
          fi

          # 库里的文件名可能带 epoch 冒号（mpv-git-1:0.41…），而 GitHub 资产名里的
          # 冒号已在上传前换成点号，比较前先统一成点号。
          declare -A keep=()
          for f in "${db_files[@]}"; do
            keep["${f//:/.}"]=1
          done

          mapfile -t release_assets < <(
            gh release view "$REPO_RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')

          for asset in "${release_assets[@]}"; do
            [[ "$asset" == *.pkg.tar.zst ]] || continue
            [ -n "${keep[$asset]+x}" ] && continue
            echo "删除数据库已不引用的资产: $asset"
            gh release delete-asset "$REPO_RELEASE_TAG" "$asset" --repo "$GH_REPO" --yes
          done
