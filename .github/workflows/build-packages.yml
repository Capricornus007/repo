              # manifest.json，version 給版本、artifacts[id=linux-rpm-x64] 給校驗和與 URL。
              # linux 產物只有 x64 的 deb/rpm 兩項（arm64 只在 mac 那側），故只發 x86_64。
              # 與國際版同一類資料但端點、檔名、佈局全不同，兩包各自讀各自的。
              _qcn=$(curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 10 \
                       "https://static.qoder.com.cn/qoder-app/releases/latest/manifest.json" 2>/dev/null || true)
              [ -n "$_qcn" ] || skip "拿不到 Qoder CN 的 releases/latest/manifest.json"
              TARGET_PKGVER=$(printf '%s' "$_qcn" | jq -r '.version // empty')
              case "$TARGET_PKGVER" in ""|0|*[!0-9.]*) skip "拿不到 Qoder CN 版本號（=$TARGET_PKGVER）" ;; esac
              _qcn_sha=$(printf '%s' "$_qcn" | jq -r '.artifacts[] | select(.id=="linux-rpm-x64") | .sha256' | head -n1)
              _qcn_url=$(printf '%s' "$_qcn" | jq -r '.artifacts[] | select(.id=="linux-rpm-x64") | .url' | head -n1)
              printf '%s' "$_qcn_sha" | grep -Eq '^[0-9a-fA-F]{64}$' \
