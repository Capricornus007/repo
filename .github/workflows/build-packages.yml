                plain(){ :; }; msg2(){ :; }; warning(){ :; }; remove_deps(){ :; }
                cd /tmp/tkg-ver || exit 1
                source ./customization.cfg >/dev/null 2>&1
                source ./PKGBUILD >/dev/null 2>&1
                _dir="${_mesa_srcdir:-mesa}"
                url=$(for s in "${source[@]}"; do printf "%s\n" "$s"; done \
                      | sed -E "s/^[^:]*:://; s/^git\+//; s/#[^:]*$//" \
                      | grep -E "^https?://" | head -n1)
                [ -n "$url" ] || exit 1
                git clone --quiet --filter=blob:none "$url" "$_dir" || exit 1
                pkgver
              ') || skip "跑 $PKG 的 pkgver() 失敗"
              case "$TARGET_PKGVER" in
                *[!0-9A-Za-z._+-]*|"") skip "拿不到 $PKG 上游版本（=$TARGET_PKGVER）" ;;
              esac
              elif [ "${KIND:-}" = kde ]; then
              # KDE 家族 -git：忠實複現 makepkg 的 pkgver()——整份 source
              # ./PKGBUILD（用 bash -c 起乾淨子殼，避免本步 set -u 撞上 PKGBUILD
              # 頂層 arch=($CARCH) 的未綁定變數）、按 source URL blobless 克隆
              # （保留 commits/tags 給 rev-list/describe）、跑 PKGBUILD 自己的
              # pkgver()。三形態（git describe / rev-list / RELEASE_SERVICE_VERSION）
              # 統一處理，免逐包 case。
              rm -rf /tmp/kde-ver; mkdir -p /tmp/kde-ver; cp PKGBUILD /tmp/kde-ver/
              TARGET_PKGVER=$(bash -c '
                cd /tmp/kde-ver || exit 1
                source ./PKGBUILD >/dev/null 2>&1
                url=$(for s in "${source[@]}"; do printf "%s\n" "$s"; done \
                      | sed -E "s/^[^:]*:://; s/^git\+//; s/#[^:]*$//" \
                      | grep -E "^https?://" | head -n1)
                [ -n "$url" ] || exit 1
                git clone --quiet --filter=blob:none "$url" "${pkgname%-git}" || exit 1
                pkgver
              ') || skip "跑 $PKG 的 pkgver() 失敗"
              case "$TARGET_PKGVER" in
                *[!0-9A-Za-z._+-]*|"") skip "拿不到 $PKG 上游版本（=$TARGET_PKGVER）" ;;
              esac
              # 依賴就緒門檻：家族 -git 依賴必須全部已發布到 junlin03-aur（init env
              # 已把它掛成 pacman 源），否則跳過讓 job 綠。矩陣並行 + 每小時排程
              # → 按依賴 DAG 逐層收斂（本家族最深 6 層，冷啟動約 7 輪填滿）。缺依賴
              # 直接 makepkg -s 會紅，这里提前跳過。
              fam_deps=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                          for d in "${depends[@]}" "${makedepends[@]}"; do printf "%s\n" "$d"; done' \
                          | sed -E "s/[<>=].*//" | sort -u | grep -- "-git$" || true)
              for d in $fam_deps; do
                pacman -Si -- "$d" >/dev/null 2>&1 \
                  || skip "KDE 依賴 $d 尚未發布到 junlin03-aur，本轮跳过等下轮"
              done
              else
              # 通用 AUR -git 包（sway/wlroots/waybar 等）：忠實複現 makepkg 的
              # pkgver()——整份 source ./PKGBUILD（bash -c 起乾淨子殼，避免本步
              # set -u 撞上 PKGBUILD 頂層未綁定變數）、按 source URL blobless 克隆
              # （保留 commits/tags 給 rev-list/describe）、跑 PKGBUILD 自己的
              # pkgver()。與 kde 分支同款算法。
              rm -rf /tmp/generic-ver; mkdir -p /tmp/generic-ver; cp PKGBUILD /tmp/generic-ver/
              TARGET_PKGVER=$(bash -c '
                cd /tmp/generic-ver || exit 1
                source ./PKGBUILD >/dev/null 2>&1
                url=$(for s in "${source[@]}"; do printf "%s\n" "$s"; done \
                      | sed -E "s/^[^:]*:://; s/^git\+//; s/#[^:]*$//" \
                      | grep -E "^https?://" | head -n1)
                [ -n "$url" ] || exit 1
                git clone --quiet --filter=blob:none "$url" "${pkgname%-git}" || exit 1
                pkgver
              ') || skip "跑 $PKG 的 pkgver() 失敗"
              case "$TARGET_PKGVER" in
                *[!0-9A-Za-z._+-]*|"") skip "拿不到 $PKG 上游版本（=$TARGET_PKGVER）" ;;
              esac
              # 家族依賴門檻（wayland/aur 家族用）：sway-git depends wlroots-git、
              # fcitx5-git depends xcb-imdkit-git，這些 -git 依賴必須已發布到
              # junlin03-aur，否則 makepkg -s 直接紅（2026-09-17 實測
              # 「error: target not found: wlroots-git」）。掛了 junlin03-aur 源的
              # job 才能查到；沒掛的 kind 查不到會被誤跳，所以只在掛源的 kind 生效。
              if [ "${KIND:-}" = wayland ] || [ "${KIND:-}" = aur ]; then
                fam_deps=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                            for d in "${depends[@]}" "${makedepends[@]}"; do printf "%s\n" "$d"; done' \
                            | sed -E "s/[<>=].*//" | sort -u | grep -- "-git$" || true)
                for d in $fam_deps; do
                  pacman -Si -- "$d" >/dev/null 2>&1 \
                    || skip "Wayland 依賴 $d 尚未發布到 junlin03-aur，本轮跳过等下轮"
                done
              fi
              fi ;;
          esac

          echo "目标版本: $TARGET_PKGVER-$TARGET_PKGREL"

          # 真正的「要不要构建」判据：产物是否已经发布到 release。
          # 原来靠 pkgver 字符串比对，CachyOS 那条 (rc 的 7.2 != pkgver 7.2.0) 永远为真，
          # 于是每天重编两个完整内核，天天撞上限。
          #
          # epoch 包（mpv-git epoch=1）的资产名是 mpv-git-1.0.41.0-…——makepkg 拼出的
          # 「1:0.41.0…」里的冒号在上传前被统一换成了点号。比对必须带上「1.」前缀，
          # 否则永远匹配不上，每个整点都会白编一次。
          EPOCH_PART=""
          if [ "$CUR_EPOCH" != "0" ]; then EPOCH_PART="${CUR_EPOCH}."; fi
          # rc 变体的产物文件名在打包后被插入 -rc- 中缀（见「云端编译」步骤的 mv），
          # 资产比对必须带上同样的中缀，否则 rc 永远匹配不上、每天白编一次
          # 3 小时的内核（2026-09-07 实测：7.3.rc1-2 已在 release 里仍全程重编）。
          asset_prefix="${PKGBASE}-${EPOCH_PART}"
          if [ "$VARIANT" = "rc" ]; then asset_prefix="${PKGBASE}-rc-${EPOCH_PART}"; fi
          assets=$(gh_api "https://api.github.com/repos/${GH_REPO}/releases/tags/${REPO_RELEASE_TAG}" \
                   | jq -r '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -q "^${asset_prefix}${TARGET_PKGVER}-${TARGET_PKGREL}-"; then
            skip "${asset_prefix}${TARGET_PKGVER}-${TARGET_PKGREL} 已在 release 里"
          fi

          {
            echo "build=true"
            echo "pkgver=$TARGET_PKGVER"
            echo "pkgrel=$TARGET_PKGREL"
            echo "cachy_tag=$CACHY_TAG"
            echo "pkgbase=$PKGBASE"
          } >> "$GITHUB_OUTPUT"

      - name: 云端编译 protonvpn 的 AUR 依赖
        if: matrix.repo_name == 'protonvpn-cli-community-git' && steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/pv-deps
          # python-pythondialog 已从官方仓库移除，AUR 上的 proton 两件套也远落后
          # 于 fork pyproject 的要求，但它们在哪儿都无处可装——这里只求编出来
          # 满足 makepkg 的依赖解析；用户机器上实际用的是自己装的较新版本。
          for aur_pkg in python-pythondialog python-proton-core python-proton-vpn-api-core; do
            rm -rf "/build/pv-deps/${aur_pkg}"
            git clone --depth=1 "https://aur.archlinux.org/${aur_pkg}.git" "/build/pv-deps/${aur_pkg}"
            chown -R builder:builder "/build/pv-deps/${aur_pkg}"
            (cd "/build/pv-deps/${aur_pkg}" \
              && su builder -c 'makepkg -si --noconfirm --needed --asdeps --skippgpcheck')
          done

      - name: 云端编译 xlibre-input-libinput-git 依赖的 xserver 拆分包
        if: matrix.repo_name == 'xlibre-input-libinput-git' && steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/xlibre-server
          git clone "https://aur.archlinux.org/xlibre-xserver-git.git" /build/xlibre-server/xlibre-xserver-git
          # 同「拉取」步骤：上游把 xkb/README.compiled 挪到了 Xext/xkeyboard/
          sed -i 's|"xkb/README.compiled"|"Xext/xkeyboard/README.compiled"|' /build/xlibre-server/xlibre-xserver-git/PKGBUILD
          chown -R builder:builder /build/xlibre-server
          cd /build/xlibre-server/xlibre-xserver-git
          # 驱动编译只需要 server/common/devel 三个拆分包。makepkg 没有「只打
          # 一部分拆分包」的选项，七个全打也很快（只是重复跑几遍 meson install），
          # 下面安装时只装这三个。
          su builder -c 'makepkg -s --noconfirm -f'
          # AUR 的 xlibre-xserver-git 自带循环依赖：server 拆分包 depends
          # xlibre-input-libinput（正是本 job 要编的驱动）。容器里装它时声明
          # 假定已满足即可，用户机器上两者都在我们自己的仓库里，不冲突。
          pacman -U --noconfirm --needed --asdeps \
            --assume-installed xlibre-input-libinput \
            ./xlibre-xserver{,-common,-devel}-git-*.pkg.tar.zst

      - name: 改写 PKGBUILD（版本、config、cjktty 补丁）
        if: matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true'
        env:
          PKG: ${{ matrix.repo_name }}
          VARIANT: ${{ matrix.variant }}
          NEW_PKGVER: ${{ steps.plan.outputs.pkgver }}
          NEW_PKGREL: ${{ steps.plan.outputs.pkgrel }}
          # Qoder 四包用：plan 從各自官方端點讀回來的校驗和
          # （x86_64 與 aarch64 各一條，拿不到的就是空字串）
          NEW_SHA_X86: ${{ steps.plan.outputs.sha_x86 }}
          NEW_SHA_ARM: ${{ steps.plan.outputs.sha_arm }}
          CACHY_TAG: ${{ steps.plan.outputs.cachy_tag }}
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd pkg_dir
          cp PKGBUILD /tmp/PKGBUILD.orig
          gh_api() { curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # 只有使用者点名的这两个内核要强制改 config；ltscjk / dkms 套件保持原样
          case "$PKG" in linux-zencjk|linux-cachyos-cjktty) INJECT=1 ;; *) INJECT=0 ;; esac

          # ---------- 共用：把 CJK + dae 需要的内核选项强制写进 config ----------
          # 用「先删同名行再追加」而不是单纯 >> ，避免 config 里出现
          # 「# CONFIG_X is not set」和「CONFIG_X=y」两行并存。
          # 注意：CONFIG_NET_SCH_CLSACT / CONFIG_BPF_TC 在 mainline 并不存在
          # （clsact 由 NET_SCH_INGRESS 提供，模块别名 sch_clsact），
          # 照写不会报错但会被 kconfig 丢掉，所以额外补上真正生效的符号。
          if [ "$INJECT" = 1 ]; then
          {
            echo ''
            echo '# ==== injected by build-repo.yml (CI only, never committed) ===='
            echo '_ci_force_config() {'
            echo '  local _cfg="$1" _opt'
            echo "  if ! grep -q 'FONT_CJK_16x16' lib/fonts/Kconfig 2>/dev/null; then"
            echo '    echo "错误：cjktty 补丁没有套用成功（lib/fonts/Kconfig 找不到 FONT_CJK_16x16）" >&2'
            echo '    return 1'
            echo '  fi'
            echo '  for _opt in CONFIG_FONT_CJK_16x16 CONFIG_FONT_CJK_32x32 \'
            echo '              CONFIG_NET_CLS_ACT CONFIG_NET_CLS_BPF \'
            echo '              CONFIG_NET_SCH_CLSACT CONFIG_BPF_TC \'
            echo '              CONFIG_NET_SCH_INGRESS CONFIG_NET_ACT_BPF \'
            echo '              CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_DEBUG_INFO_BTF; do'
            echo '    sed -i -E "/^(# )?${_opt}[ =]/d" "$_cfg"'
            echo "    printf '%s=y\\n' \"\$_opt\" >> \"\$_cfg\""
            echo '  done'
            echo '  echo "已强制写入 CJK 字体 + dae/BPF 内核选项"'
            echo '}'
          } >> PKGBUILD
          # 在 prepare() 里 `cp ../config .config` 之前插入调用（此时补丁已套用完）
          sed -i -E 's|^([[:space:]]*)cp \.\./config \.config$|\1_ci_force_config ../config\n&|' PKGBUILD
          grep -n '_ci_force_config ../config' PKGBUILD
          fi

          case "$PKG" in
            linux-zencjk)
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              # Arch 的 linux-zen config 按 <pkgver>-<pkgrel> 打 tag；没有对应 tag 时退回 main
              # PKGBUILD 里原本写的是 ${pkgver}-${pkgrel} 模板，能解析就别动它，
              # 否则会把写死的 tag 提交回 linux-zencjk 仓库，本地 yay 也跟着受害。
              cfg_tag="${NEW_PKGVER}-${NEW_PKGREL}"
              if curl -sfI "https://gitlab.archlinux.org/archlinux/packaging/packages/linux-zen/-/raw/${cfg_tag}/config.x86_64" >/dev/null; then
                echo "Arch gitlab tag ${cfg_tag} 存在，沿用 PKGBUILD 原本的模板"
              else
                echo "::warning::Arch gitlab 还没有 tag ${cfg_tag}，本次临时用 main 分支的 config，且不回推 PKGBUILD"
                sed -i -E "s|(config::https://gitlab\\.archlinux\\.org/archlinux/packaging/packages/linux-zen/-/raw/)[^/]+(/config\\.x86_64)|\\1main\\2|" PKGBUILD
                touch /tmp/skip_push
              fi
              grep -n 'gitlab.archlinux.org' PKGBUILD

              # cjktty 补丁：只在「版本线变了」时才改 URL，同一条线上不动已验证过的钉子
              cur_patch=$(grep -oE 'cjktty-[0-9]+\.[0-9]+(\.[0-9]+)?\.patch' PKGBUILD | head -n1 || true)
              new_series="${NEW_PKGVER%.*}"; new_series="${new_series%.*}"
              cur_series=$(echo "$cur_patch" | sed -E 's/^cjktty-([0-9]+\.[0-9]+).*/\1/')
              if [ -n "$cur_patch" ] && [ "$cur_series" != "$new_series" ]; then
                cand=$(gh_api "https://api.github.com/repos/bigshans/cjktty-patches/contents/v${new_series%%.*}.x" \
                       | jq -r '.[].name' | grep -E "^cjktty-${new_series//./\\.}(\.[0-9]+)?\.patch$" | sort -V | tail -n1 || true)
                if [ -n "$cand" ]; then
                  echo "cjktty 补丁 $cur_patch -> $cand（版本线 $cur_series -> $new_series）"
                  sed -i "s|$cur_patch|$cand|" PKGBUILD
                else
                  echo "::warning::bigshans/cjktty-patches 里找不到 $new_series 的补丁，仍用 $cur_patch"
                fi
              fi
              ;;

            linux-ltscjk)
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              # cjktty 补丁按版本线取仓库里最新的一份。
              # 教训：6.12.104 在 bit_cursor() 里加了字形索引夹紧，钉死在
              # cjktty-6.12.101.patch 上会 hunk #5 FAILED，prepare() 直接中断。
              # 这里不做「套不上就跳过」，套不上就让 job 红掉——宁可缺一次包，
              # 也不要出一颗没有 CJK 字体的内核。
              lts_series=$(echo "$NEW_PKGVER" | cut -d. -f1,2)
              lts_esc="${lts_series//./\\.}"
              cur_patch=$(grep -oE 'cjktty-[0-9]+\.[0-9]+(\.[0-9]+)?\.patch' PKGBUILD | head -n1 || true)
              newest=$(gh_api "https://api.github.com/repos/${REPO_OWNER}/cjktty-patches/contents/v${lts_series%%.*}.x" \
                       | jq -r '.[].name' \
                       | grep -E "^cjktty-${lts_esc}(\.[0-9]+)?\.patch$" | sort -V | tail -n1 || true)
              if [ -z "$newest" ]; then
                echo "::warning::cjktty-patches 里找不到 $lts_series 线的补丁，仍用 ${cur_patch:-原样}"
              elif [ -n "$cur_patch" ] && [ "$newest" != "$cur_patch" ]; then
                echo "cjktty 补丁 $cur_patch -> $newest"
                sed -i "s|$cur_patch|$newest|" PKGBUILD
              else
                echo "cjktty 补丁已是最新：${cur_patch:-?}"
              fi
              ;;

            snd-pcsp-dkms)
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              ;;

            linux-cachyos-cjktty)
              tag_part="${CACHY_TAG#cachyos-}"
              base="${tag_part%-*}"
              if [ "$VARIANT" = "rc" ]; then
                series="${base%-rc*}"
                rcver="rc${base##*-rc}"
                sed -i "s/^_major=.*/_major=$series/"    PKGBUILD
                sed -i "s/^_minor=.*/#_minor=/"          PKGBUILD
                sed -i "s/^#_rcver=.*/_rcver=$rcver/; s/^_rcver=.*/_rcver=$rcver/" PKGBUILD
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/config"
              else
                case "$base" in
                  *.*.*) series="${base%.*}"; minor="${base##*.}" ;;
                  *)     series="$base";      minor="0" ;;
                esac
                sed -i "s/^_major=.*/_major=$series/"  PKGBUILD
                sed -i "s/^_minor=.*/_minor=$minor/"   PKGBUILD
                sed -i "s/^_rcver=.*/#_rcver=/"        PKGBUILD
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/config"
              fi
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/"          PKGBUILD
              sed -i "s/^pkgrel=.*/pkgrel=$NEW_PKGREL/"          PKGBUILD
              sed -i "s/^_tagrel=.*/_tagrel=${CACHY_TAG##*-}/"   PKGBUILD
              # _srcname 直接用 tag：tarball 就叫 <tag>.tar.gz，不必再拼一遍
              sed -i "s/^_srcname=.*/_srcname=$CACHY_TAG/"       PKGBUILD

              # 「根据情况」挑 config：CachyOS 两个打包目录的版本线不一定跟得上我们要构建的 tag
              # （现状：linux-cachyos 还停在 7.1.8，而 CachyOS/linux 的 release tag 已经是 7.2.0）。
              # 拿错版本线的 config 只会让 make olddefconfig 用默认值填一大堆新符号，
              # 编得出来但不是本意，所以优先挑版本线对得上的那一份。
              _cfg_major() {
                curl -sfL "https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/$1/PKGBUILD" \
                  | sed -nE 's/^_major=([0-9.]+).*/\1/p' | head -n1
              }
              rel_maj=$(_cfg_major linux-cachyos || true)
              rc_maj=$(_cfg_major linux-cachyos-rc || true)
              echo "CachyOS 打包目录版本线：linux-cachyos=${rel_maj:-?}  linux-cachyos-rc=${rc_maj:-?}  本次要=$series"
              if [ -n "$rel_maj" ] && [ "$series" = "$rel_maj" ]; then
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/config"
              elif [ -n "$rc_maj" ] && [ "$series" = "$rc_maj" ]; then
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/config"
              else
                echo "::warning::CachyOS 两个打包目录都不是 $series 线，沿用默认 $config_url"
              fi

              echo "下载 config: $config_url"
              curl -sfL -o config "$config_url"
              grep -m1 'Kernel Configuration' config || true

              # cjktty 补丁：优先 cjktty-<series>.patch，没有就退到同线最高的 -rcN
              avail=$(gh_api "https://api.github.com/repos/Capricornus007/cjktty-patches/contents/v${series%%.*}.x" \
                      | jq -r '.[].name' || true)
              esc="${series//./\\.}"
              pick=$(printf '%s\n' "$avail" | grep -E "^cjktty-${esc}(\.[0-9]+)?\.patch$" | sort -V | tail -n1 || true)
              [ -n "$pick" ] || pick=$(printf '%s\n' "$avail" | grep -E "^cjktty-${esc}-rc[0-9]+\.patch$" | sort -V | tail -n1 || true)
              if [ -z "$pick" ]; then
                # 跨线回退：rc 线的内核往往还能套上一线的 rc 补丁
                #（实测 7.3-rc1 可干净套 7.2-rc7 的补丁）。取整个 v<major>.x 里
                # sort -V 最新的一个，并留下警告便于追查。
                pick=$(printf '%s\n' "$avail" | grep -E '^cjktty-.*\.patch$' | sort -V | tail -n1 || true)
                if [ -n "$pick" ]; then
                  echo "::warning::$series 没有专属 cjktty 补丁，跨线回退到 $pick（若 hunk 失败请先补 cjktty-patches）"
                fi
              fi
              [ -n "$pick" ] || { echo "错误：cjktty-patches 里找不到 $series 的补丁"; exit 1; }
              echo "选用 cjktty 补丁: $pick"
              curl -sfL -o 0001-cjktty.patch \
                "https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master/v${series%%.*}.x/$pick"
              sed -i -E 's|^[[:space:]]*"\$\{_cjktty_source\}/v[0-9]+\.x/cjktty-[^"]+\.patch"[[:space:]]*$|    "0001-cjktty.patch"|' PKGBUILD
              curl -sfL -o cjktty-add-cjk32x32-font-data.patch \
                "https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master/cjktty-add-cjk32x32-font-data.patch"
              sed -i -E 's|^[[:space:]]*"\$\{_cjktty_source\}/cjktty-add-cjk32x32-font-data\.patch"[[:space:]]*$|    "cjktty-add-cjk32x32-font-data.patch"|' PKGBUILD

              # ---------- gud fortify 假阳性规避（CI-only，随 _ci_force_config 一起注入） ----------
              # 7.3-rc2 起 gud_connector.c 新增 memchr(mode, '\0', 16) 校验 TV mode 名
              # （上游 da1ea35fea67）。clang 22 + ThinLTO 在连结期把
              # __struct_size(&buf[i*16]) 折叠成小于 16 的常量，ld.lld 对 gud.o 报
              # __read_overflow "dontcall-error"。运行期恒安全：buf 是 kmalloc(256)，
              # gud_usb_get -> usb_control_msg 的返回上限就是传入的 len，故
              # num_modes ≤ 16、i*16+16 ≤ 256——纯编译期假阳性。
              # 换成 __builtin_memchr 绕过 fortify 内联检查，语义不变；
              # 上游哪天改掉这行，下面的 grep 不中、注入自动变 no-op。
              {
                echo '_ci_fix_gud_fortify() {'
                echo '  local f="drivers/gpu/drm/gud/gud_connector.c"'
                echo '  [ -f "$f" ] || return 0'
                echo '  grep -q "__builtin_memchr(mode, " "$f" && return 0'
                echo '  grep -q "memchr(mode, " "$f" || return 0'
                echo '  sed -i "s/memchr(mode, /__builtin_memchr(mode, /" "$f"'
                echo '  grep -q "__builtin_memchr(mode, " "$f" || { echo "错误：gud fortify 规避失败" >&2; return 1; }'
                echo '  echo "gud: memchr -> __builtin_memchr（规避 clang ThinLTO fortify 假阳性）"'
                echo '}'
              } >> PKGBUILD
              # 插在 _ci_force_config 之前：此时 prepare() 里补丁已套用完、源码树就位
              sed -i -E 's|^([[:space:]]*)_ci_force_config \.\./config$|\1_ci_fix_gud_fortify\n&|' PKGBUILD
              grep -n '^[[:space:]]*_ci_fix_gud_fortify$' PKGBUILD
              ;;
            u1s1-bin)
              # 新版本時把 pkgver 換成 LATEST 讀到的值；pkgrel 保持 1。
              # PKGBUILD 的 source URL 是字面 ${pkgver} 模板字串。sed 替換端
              # 不能寫 \1$NEW_PKGVER——sed 會把 \1 後的 $N 解析成第 N 個捕獲組
              # 造成替換失效；用單引號字面 + 變數拼接最穩。
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              sed -i 's/u1s1-cli-${pkgver}/u1s1-cli-'"${NEW_PKGVER}"'/g' PKGBUILD
              grep -n 'u1s1-cli-' PKGBUILD
              ;;
            element-desktop-nightly-bin)
              # 元素 nightly 包：更新 pkgver 為新的日期版本號。
              # PKGBUILD source URL 使用 ${pkgver} 模板，直接更新 pkgver 即可。
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              grep -n '^pkgver=' PKGBUILD
              ;;
            nashira-git)
              # -git 包：版本跟 master HEAD 走（plan 已算好）；
              # source 是 git repo，無 URL 模板要改，只換 pkgver
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              grep -n '^pkgver=' PKGBUILD
              ;;
            unicode-emoji)
              # pkgver 就是官方目錄名（三段），URL 全由它展開，只改這一行。
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              grep -n '^pkgver=' PKGBUILD
              ;;
            qoder-cli|qoder-cli-cn|qoder-gui-bin|qoder-gui-cn|qoder-ide-bin)
              # Qoder 五包：PKGBUILD 的 source 是「<檔名>-/${pkgver}/…」模板，sed 掉
              # ^pkgver= 一行就自動跟著新版本取檔；校驗和由 plan 從官方端點讀回來後
              # 逐行換掉（四包的 sha 都是 64 位十六進位、pkgver 只含數字與點號，
              # 不會踩 u1s1-bin 那條「\1$N 被 sed 當成第 N 個捕獲組」的陷阱——
              # 這裡根本不用捕獲組，整行替換）。
              sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" PKGBUILD
              if [ -n "${NEW_SHA_X86:-}" ]; then
                sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$NEW_SHA_X86')/" PKGBUILD
              else
                echo "::warning::$PKG 本次沒有拿到 x86_64 校驗和，PKGBUILD 維持原值"
              fi
              if [ -n "${NEW_SHA_ARM:-}" ]; then
                sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$NEW_SHA_ARM')/" PKGBUILD
              fi
              echo "==== $PKG 改寫結果 ===="
              grep -nE '^(pkgver|sha256sums_x86_64|sha256sums_aarch64)=' PKGBUILD
              ;;
            codex-desktop-git)
              # codex-desktop-git 由 AUR 提供，CI 無法預先知悉 build 時下載的 deb 版本。
              # 此處不修改 PKGBUILD，讓 makepkg 的 pkgver() 在 build 時自動設定版本。
              :
              ;;
          esac

          echo "==== PKGBUILD 版本区 ===="
          grep -nE '^(pkgver|pkgrel|_major|_minor|_rcver|_tagrel|_srcname)=' PKGBUILD || true

      # tkg（mesa-tkg-git，Tk-Glitch 模板）必须整步跳过。它的 PKGBUILD 自带
      # `plain '...'` ASCII logo、`msg2`/`warning` 提示，以及末尾的
      # `trap exit_cleanup EXIT`——这些都在 source PKGBUILD 时执行，而且 Tk-Glitch
      # 的 message 函数把 logo 与提示写到 **stdout**。updpkgsums 恰恰用
      # `newsums=$(makepkg -g ...)` 捕获 stdout 当校验和，于是那一堆 ASCII art 被
      # 当成 md5/sha512 写回 PKGBUILD，把 source 区之后的文件结构撕碎。
      # 2026-09-16 CI 实测症状：PKGBUILD 由 716 行涨到 738 行、ASCII art 插在
      # md5sums 上方，makepkg 第二次 source 直接 `Failed to source`（exit 6）；
      # 本机用 file:// 假 git 源完整复现同一现象。
      # 副作用评估：mesa 的 source 是 git（checksum=SKIP）+ LICENSE/llvm32.native
      # 两个固定文件，PKGBUILD 里写死的 md5/sha512 已与上游文件逐字节一致
      # （本地实测比对通过），所以本步骤对它本就是 no-op；它的 PKGBUILD 来自
      # chaotic-aur、不归本仓库维护，也不需要回推。跳过零损失。
      - name: 更新校验和并回推 PKGBUILD
        if: matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true' && matrix.repo_name != 'linux-cachyos-cjktty' && matrix.repo_name != 'kew-git' && matrix.repo_name != 'mpv-git' && matrix.repo_name != 'oh-my-pi-git' && matrix.repo_name != 'pysolfc-git' && matrix.repo_name != 'protonvpn-cli-community-git' && matrix.repo_name != 'dae-git' && matrix.repo_name != 'xlibre-xserver-git' && matrix.repo_name != 'xlibre-input-libinput-git' && matrix.repo_name != 'android-ndk-23' && matrix.repo_name != 'android-ndk-27' && matrix.repo_name != 'codex-desktop-git' && matrix.repo_name != 'element-desktop-nightly-bin' && matrix.repo_name != 'nashira-git' && matrix.repo_name != 'wlroots-git' && matrix.repo_name != 'qoder-cli' && matrix.repo_name != 'qoder-cli-cn' && matrix.repo_name != 'qoder-gui-bin' && matrix.repo_name != 'qoder-gui-cn' && matrix.repo_name != 'qoder-ide-bin' && matrix.repo_name != 'unicode-emoji' && matrix.repo_name != 'free-claude-code-git' && matrix.repo_name != 'bash-git' && matrix.repo_name != 'nodejs-better-sqlite3' && matrix.repo_name != 'qalculate-gtk-git' && matrix.repo_name != 'ttf-jetbrains-maple-mono-nf-xx-xx-xx' && matrix.repo_name != 'iwgtk-git' && matrix.repo_name != 'adguardhome-git' && matrix.kind != 'kde' && matrix.kind != 'tkg' && matrix.kind != 'wayland' && matrix.kind != 'aur'
        env:
          PKG: ${{ matrix.repo_name }}
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          cd pkg_dir
          chown -R builder:builder .
          # 优先从 kernel-sources-cache 下载 tarball（GitHub CDN 稳定）
          # 文件若已存在，updpkgsums 会跳过下载，只算校验和
          CACHE_REPO=Capricornus007/kernel-sources-cache
          for url in $(bash -c 'source PKGBUILD >/dev/null 2>&1; printf "%s\n" "${source[@]}"'); do
            case "$url" in
              https://www.kernel.org/pub/linux/kernel/*.tar.xz)
                fname="${url##*/}"
                if [ -f "$fname" ]; then
                  echo "✅ $fname 已存在，跳过缓存"
                  continue
                fi
                echo "尝试从缓存下载 $fname ..."
                gh release download "kernel-sources" --repo "$CACHE_REPO" -p "$fname" -D . 2>/dev/null || true
                if [ -f "$fname" ]; then
                  echo "✅ 从缓存成功下载 $fname ($(stat -c%s "$fname") 字节)"
                fi
                ;;
            esac
          done
          # kernel.org 偶尔会 reset 大文件的 HTTP/2 连接，删掉半截文件重试。
          # 注意：第一次不能删——上面可能刚从 kernel-sources-cache 拿到完整文件。
          sums_updated=false
          for attempt in 1 2 3 4 5; do
            [ "$attempt" -eq 1 ] || rm -f linux-*.tar.xz linux-*.tar.xz.part
            rm -f linux-*.tar.xz.part
            if su builder -c "updpkgsums"; then sums_updated=true; break; fi
            echo "更新校验和失败（第 ${attempt}/5 次），稍后重试"
            sleep $((attempt * 30))
          done
          if [ "$sums_updated" != "true" ]; then
            echo "::error::无法可靠下载新源码，本次不构建"
            exit 1
          fi
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

          # 回推时不能带上 CI 注入的 _ci_force_config，用原始 PKGBUILD 重放版本改动
          cp PKGBUILD /tmp/PKGBUILD.ci
          if [ -f /tmp/skip_push ]; then
            echo "本次改动含临时性内容，不回推 PKGBUILD"
          else
            sed -i '/^# ==== injected by build-repo\.yml/,$d' PKGBUILD
            sed -i -E '/^[[:space:]]*_ci_force_config \.\.\/config$/d' PKGBUILD
            printf '%s\n' "$(cat PKGBUILD)" > PKGBUILD   # 去掉注入留下的尾端空行
            git add PKGBUILD .SRCINFO
            git commit -m "chore: auto update PKGBUILD & .SRCINFO" || true
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO_OWNER}/${PKG}.git" HEAD || true
          fi
          # 推完再把注入版换回来给 makepkg 用
          cp /tmp/PKGBUILD.ci PKGBUILD
          chown -R builder:builder .

      - name: 回推 in-tree 套件的 PKGBUILD（Element / Nashira / Qoder 四包）
        # 这些包的打包文件都维护在本仓库子目录里（element-desktop-nightly-bin/、
        # nashira-git/、qoder-cli/、qoder-cli-cn/、qoder-gui-bin/、qoder-gui-cn/），
        # 源随版本滚动（nightly deb / master HEAD / 各官方 manifest），sha256 要么全为
        # SKIP、要么由「改写 PKGBUILD」步驟從官方端點直接更新，都不折腾 updpkgsums
        # （用户指示：sums 能跳过就跳过；Qoder 的源是 250MB 級大檔，讓 updpkgsums 再抓
        # 一遍只是白燒一次頻寬）。這裡只把新版本號與校驗和回推到本倉庫，讓 plan 的版本
        # 比對下一輪直接命中；通用回推步驟會把 PKGBUILD 推到不存在的獨立倉庫，所以都在
        # 排除清單裡。[skip ci] 避免 push 再觸發一輪全量建構。同輪多個 job 併發回推會
        # 撞 master 的 ref 鎖
        # （自己 clone 之後 master 被對方推進，push 被拒而整個 job 變紅）——
        # 各個包改的檔案不相交，失敗就重新克隆最新 master 重放提交，
        # 隨機退避重試，最多 5 次
        if: (matrix.repo_name == 'element-desktop-nightly-bin' || matrix.repo_name == 'nashira-git' || matrix.repo_name == 'qoder-cli' || matrix.repo_name == 'qoder-cli-cn' || matrix.repo_name == 'qoder-gui-bin' || matrix.repo_name == 'qoder-gui-cn') && steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW_PKGVER: ${{ steps.plan.outputs.pkgver }}
          PKG: ${{ matrix.repo_name }}
        run: |
          set -euo pipefail
          # 并发回推竞态的处理见上方注释。循环里不 cd 进克隆目录（下一轮
          # rm -rf 删的就是它），统一 git -C；push 单独放 if 里，让它的失败
          # 走重试，而不是被 set -e 直接判死整个 step。
          pushed=false
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/repo-push
            git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" /tmp/repo-push
            cp pkg_dir/PKGBUILD "/tmp/repo-push/${PKG}/PKGBUILD"
            git -C /tmp/repo-push config user.name "github-actions[bot]"
            git -C /tmp/repo-push config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git -C /tmp/repo-push diff --quiet; then
              echo "PKGBUILD 无变化，不回推"
              pushed=true
              break
            fi
            git -C /tmp/repo-push add "${PKG}/PKGBUILD"
            git -C /tmp/repo-push commit -m "chore: ${PKG} auto update to ${NEW_PKGVER} [skip ci]"
            if git -C /tmp/repo-push push; then
              echo "已回推 PKGBUILD 到本仓库 master"
              pushed=true
              break
            fi
            echo "回推失败（第 ${attempt}/5 次）：master 多半刚被同轮其他 in-tree job 推进，"
            echo "重新克隆最新 master 重放本轮改动（两个包的文件不相交，不会冲突）"
            if [ "$attempt" -lt 5 ]; then
              # 随机退避加 PID 抖动，错开竞争方的重试节奏，避免节拍同步反复对撞
              sleep $(( ((RANDOM + $$) % 10) + 5 ))
            fi
          done

          if [ "$pushed" != true ]; then
            echo "::error::回推 PKGBUILD 到本仓库 master 连续 5 次失败"
            exit 1
          fi

      - name: 预下载 NDK 镜像源码
        if: (matrix.repo_name == 'android-ndk-23' || matrix.repo_name == 'android-ndk-27') && steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd pkg_dir
          # makepkg 的 CURL_OPTIONS（max-time 300）撑不住 ~700MB 的下载；
          # 把源码包先放进 PKGBUILD 同目录，makepkg 会直接复用不再下载。
          zip_url=$(bash -c 'source ./PKGBUILD >/dev/null 2>&1;
                    for u in "${source[@]}"; do printf "%s\n" "$u"; done'             | grep -E '^https://github\.com/.*/releases/download/' | head -n1)
          [ -n "$zip_url" ] || { echo "PKGBUILD 里找不到镜像源码 URL"; exit 1; }
          fname="${zip_url##*/}"
          if [ -f "$fname" ]; then
            echo "$fname 已存在，跳过下载"
          else
            echo "下载 $fname ..."
            curl -fL --retry 5 --retry-delay 15 --connect-timeout 30 -o "$fname" "$zip_url"
          fi
          ls -lh "$fname"
          chown -R builder:builder .

      - name: 预下载 Qoder 四包的上游源码
        # 四個 Qoder 包的源都在阿里雲 OSS / 境內 CDN（qoder-ide.oss-accelerate…、
        # static.qoder.com.cn），體積大：國際 GUI 的 RPM 250MB、CN GUI 190MB、
        # 兩個 CLI 的 tarball 各 80MB。makepkg 自帶的 CURL_OPTIONS 有 --max-time 300
        # （見「初始化 Arch Linux 環境」），境外 runner 拉這種大檔很容易在半途被掐斷
        # ——同 android-ndk 那 700MB zip 的教訓，所以照同一套「預下載」做法：
        # 先用不設 max-time 的 curl 把檔落到 PKGBUILD 同目錄，
        # 檔名與 source 陣列逐字一致，makepkg 見檔已在就直接複用、不再觸網。
        # 重試策略（2026-09-18 用戶拍板）：無限重試直到成功。舊寫法的
        # --speed-limit 2048/--speed-time 120 配上 --retry 5 是「失敗條件」——
        # CN 端點對境外 IP 恆速限流（實測單連線 ~48KB/s、雙連線無提速＝按 IP
        # 限速），慢而不斷傳輸的鏈路一旦抖到閾值下就會被掐掉，5 次燒完整個 job
        # 變紅，190MB 在這種速度下本來就要 70 分鐘上下，經不起一次掐斷。
        # 現在單次只留 --connect-timeout、不設 max-time／速度下限，失敗就刪半截檔
        # 30 秒後重來，直到成功為止；最外邊界由 job 的 timeout-minutes（360）兜底，
        # 真拉到超時讓它紅，也不會有比「下載不回來」更壞的結果。
        if: (matrix.repo_name == 'qoder-cli' || matrix.repo_name == 'qoder-cli-cn' || matrix.repo_name == 'qoder-gui-bin' || matrix.repo_name == 'qoder-gui-cn') && steps.plan.outputs.build == 'true'
        run: |
          set -uo pipefail
          cd pkg_dir
          # 展開後的 source 條目形如 <落地檔名>::<url>，也有直接給 url 的；
          # ${pkgver} 在 source ./PKGBUILD 時就已展開成實際版本，跟後面 makepkg
          # 用的完全同一個字串。
          while IFS= read -r s; do
            [ -n "$s" ] || continue
            case "$s" in
              *::*) fname="${s%%::*}"; url="${s#*::}" ;;
              *)    url="$s";          fname="${url##*/}" ;;
            esac
            case "$url" in https://*|http://*) ;; *) continue ;; esac
            if [ -f "$fname" ]; then
              echo "$fname 已存在，跳過下載"
              continue
            fi
            echo "下載 $fname <- $url"
            # 無限重試直到成功：不設 max-time、不設速度下限；curl -o 重試本身
            # 從頭覆蓋寫，這裡再顯式 rm 半截檔只是讓「已清檔重來」在日誌裡可見。
            # 校驗和由後續 makepkg 把關，預下載不需要也不能「湊合能用就行」。
            while ! curl -fL --connect-timeout 30 -o "$fname" "$url"; do
              echo "::warning::$fname 下載失敗（$(date -u '+%F %T')），30 秒後重試"
              rm -f "$fname"
              sleep 30
            done
            echo "$fname 下載完成"
          done < <(bash -c 'source ./PKGBUILD >/dev/null 2>&1
                             for x in "${source[@]:-}" "${source_x86_64[@]:-}"; do printf "%s\n" "$x"; done')
          ls -lh
          chown -R builder:builder .

      - name: 云端编译 `.pkg.tar.zst`
        if: matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true'
        env:
          # mesa-tkg：4 = stable llvm（PKGBUILD 據此把依賴定為 llvm-libs>=8.0.0，無上限）
          MESA_WHICH_LLVM: "4"
        run: |
          set -uo pipefail
          cd pkg_dir
          chown -R builder:builder .
          flags="-s --noconfirm -f"
          if [ "${{ matrix.repo_name }}" = "linux-cachyos-cjktty" ]; then
            # CachyOS 的 config / 补丁是 CI 现抓的，校验和对不上，跳过完整性检查
            flags="$flags --skipinteg"
          elif [ "${{ matrix.repo_name }}" = "element-desktop-nightly-bin" ]; then
            # nightly deb 天天换，PKGBUILD 里写死的 sha256 必然失配；源是
            # Element 官方 HTTPS 仓库，跳过校验和不损失信任（用户指示：
            # sums 能跳过就跳过）
            flags="$flags --skipchecksums"
          elif [ "${PGP_OK:-1}" != "1" ]; then
            echo "::warning::有公钥没导入成功，本次跳过 PGP 校验（校验和仍然检查）"
            flags="$flags --skippgpcheck"
          fi
          echo "makepkg $flags"
          # 自有源从 GitHub Release 资产下载，偶发截断会让坏包进 pacman 缓存，
          # makepkg -s 装依赖时死在 "is corrupted (invalid or corrupted package)"
          # 且 --noconfirm 不会替它删缓存（2026-09-17 kguiaddons-git 实测：缓存里
          # 的 extra-cmake-modules-git 损坏 → 依赖解析整体失败）。抓到就删掉重试一次。
          if ! su builder -c "makepkg $flags" 2>&1 | tee /tmp/makepkg.log; then
            bad=$(grep -oE '^:: File [^ ]+ is corrupted' /tmp/makepkg.log | awk '{print $3}' | sort -u || true)
            if [ -n "$bad" ]; then
              echo "删除损坏缓存包后重试：$bad"
              rm -fv $bad
              su builder -c "makepkg $flags"
            else
              exit 1
            fi
          fi
          if [ "${{ matrix.repo_name }}" = "linux-cachyos-cjktty" ] && [ "${{ matrix.variant }}" = "rc" ]; then
            # RC 產物檔名插入 -rc（如 linux-cachyos-cjktty-rc-7.3.rc1-1-…），
            # 包內 pkgname 保持 linux-cachyos-cjktty 不變：repo-add 條目照常
            # 以版本號換代（vercmp 7.3.rc1 < 7.3.0，正式版發佈後自然回位），
            # 而清理步驟據檔名區分 rc/正式兩類，各自保留最新一份。
            for f in linux-cachyos-cjktty*-*.pkg.tar.zst; do
              [ -e "$f" ] || continue
              case "$f" in *-rc-*) continue ;; esac
              base="${f%%-[0-9]*}"   # linux-cachyos-cjktty 或 …-headers
              rest="${f#"$base"}"
              mv -v "$f" "${base}-rc${rest}"
            done
            ls -lh linux-cachyos-cjktty*.pkg.tar.zst
          fi
          if [ "${{ matrix.repo_name }}" = "xlibre-xserver-git" ]; then
            # 拆分打包里带一个 bootstrap 变体，用户点名不要。makepkg 没有
            # 「只打一部分拆分包」的选项，躲不掉打包这一步，打完直接丢弃
            rm -fv xlibre-xserver-bootstrap-git-*.pkg.tar.zst
          fi
          if [ "${{ matrix.repo_name }}" = "mesa-tkg-git" ]; then
            # ── LLVM soname 守门（防止本修复被静默回退）
            # mesa 在链接期把 libLLVM.so.X 写死，产物必须与容器（= 目标机 Artix
            # goblins 的 llvm）一致；否则装到机器上 dlopen 失败 → GLX 崩
            # （2026-09-17 实证）。只信实测：解包产物、objdump 读 NEEDED 硬核对。
            want="$(basename "$(readlink -f /usr/lib/libLLVM.so 2>/dev/null)" 2>/dev/null)"
            chk="$PWD/.llvm-check"; rm -rf "$chk"; mkdir -p "$chk"
            for f in ./*.pkg.tar.zst; do [ -e "$f" ] || continue; bsdtar -xf "$f" -C "$chk" 2>/dev/null; done
            got="$(find "$chk" -name '*.so*' -type f -print0 | xargs -0 -r objdump -p 2>/dev/null | grep -o 'libLLVM\.so\.[0-9][0-9.]*' | sort -u | tr '\n' ' ')"
            rm -rf "$chk"
            echo "容器 llvm soname=[$want]  产物 NEEDED=[$got]"
            case "$got" in
              *"$want"*) echo "✓ mesa 产物 LLVM soname 与容器一致" ;;
              *) echo "::error::mesa 产物链接的 libLLVM 与容器不一致（产物：$got ／ 容器：$want）——装到目标机会 GLX 崩"; exit 1 ;;
            esac
          fi
          ls -lh ./*.pkg.tar.zst

      - name: 暂存构建好的 `.pkg.tar.zst` 产物
        if: (matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true') || (matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true')
        run: |
          set -euo pipefail
          # 兼底：makepkg.conf 里的 OPTIONS+=(!debug) 已经按住了 debug 包，但若哪个
          # PKGBUILD 自己写了 options=(debug)，它的优先级更高。这里直接删掉，
          # 保证 -debug 包永远不会进 artifact 和 Release。
          # 用 .PKGINFO 里的真实包名判定，而不是拿文件名匆匆匹配 *-debug-*，
          # 免得误伤将来可能出现的、名字里恰好带 debug 字样的正常包。
          for f in pkg_dir/*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            name=$(pacman -Qp "$f" 2>/dev/null | awk 'NR==1{print $1}' || true)
            case "$name" in *-debug)
              echo "丢弃 debug 包: $f"
              rm -f "$f"
              ;;
            esac
          done
          # epoch 包（如 mpv-git-1:0.41.0-…）文件名含冒号，GitHub artifact
          # 路径禁止 ':' → 上传前把冒号换成点号；repo-add 读 .PKGINFO，
          # 文件名不影响 repo.db 的版本记录，pacman -U 也不受影响。
          for f in pkg_dir/*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            case "$f" in *:*)
              # 注意：bash 的 ${f//:/./} 会把 ':' 替换成 './'（实测），
              # 目标路径多出斜杠导致 mv 失败；改用 sed 逐字替换。
              new=$(printf '%s' "$f" | sed 's/:/./g')
              mv "$f" "$new"
              echo "renamed: $f -> $new"
              ;;
            esac
          done
      - name: 上传产物到 artifact
        if: (matrix.repo_name == 'ffmpeg-full-git' && steps.ffmpeg_plan.outputs.build == 'true') || (matrix.repo_name != 'ffmpeg-full-git' && steps.plan.outputs.build == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.key }}
          path: pkg_dir/*.pkg.tar.zst
          if-no-files-found: error

  deploy-repo:
    needs: build-packages
    if: always() && needs.build-packages.result != 'cancelled'
    runs-on: ubuntu-latest
    # 内核流水线和 -git 流水线都会跑到这一步，而这一步是「下载数据库 → 追加
    # 条目 → 上传覆盖」。两边同时进行的话，后上传的那份会把先上传的条目抹掉，
    # 包文件还在 Release 里但数据库不认，pacman 就看不见。
    #
    # group 里刻意不含 github.workflow：两条流水线必须落进同一个组，GitHub 才
    # 会让它们排队而不是并行。cancel-in-progress 关掉，等前一个写完再写。
    concurrency:
      group: deploy-repo-database
      cancel-in-progress: false
    permissions:
      contents: write
    container:
      image: archlinux:base-devel

    steps:
      - name: 安装工具
        run: pacman -Syu --noconfirm github-cli

      - name: 下载所有子 Job 构建好的 `.pkg.tar.zst`
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: artifact-downloads
          pattern: pkg-*
          merge-multiple: true

      - name: 检查是否有构建产物
        id: check_artifacts
        run: |
          mkdir -p artifact-downloads
          if [ -z "$(find artifact-downloads -name '*.pkg.tar.zst' -print -quit 2>/dev/null)" ]; then
            echo "没有构建产物，跳过部署"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          else
            find artifact-downloads -name '*.pkg.tar.zst' -printf '%f\n'
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          fi

      - name: 整合并更新 repo.db 数据库
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        id: build_db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          find artifact-downloads -name "*.pkg.tar.zst" -exec cp {} deploy/ \;
          cd deploy
          # 记下旧数据库是否真的拿到了。拿不到时 repo-add 会凭空建一个只含本轮
          # 产物的新库，那样下面的清理步骤会把 Release 里其他包全判成垃圾。
          if gh release download "$REPO_RELEASE_TAG" --repo "${{ github.repository }}" \
               -p "junlin03-aur.db*" -p "junlin03-aur.files*" --clobber \
             && [ -s junlin03-aur.db.tar.gz ]; then
            echo "db_restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::没能取回旧数据库，本轮只做增量添加，不清理任何旧资产"
            echo "db_restored=false" >> "$GITHUB_OUTPUT"
          fi
          # 刻意不用 -n/--new：它看到同名同版本就整条跳过，连依赖变了也不管。
          # mpv-git 就是这么坏的——PKGBUILD 把 jack2 换成虚拟包 jack 后重编，
          # 包文件更新了，数据库条目还停在旧的一次构建，pacman 于是仍想装 jack2，
          # 跟本机的 pipewire-jack 撞成无解冲突。
          # -p/--prevent-downgrade 保留了真正需要的那道保护：版本变低时拒绝写入。
          repo-add -R -p junlin03-aur.db.tar.gz ./*.pkg.tar.zst

          # 历史遗留的 -debug 条目要从库里摘掉，否则 pacman 仍会列出它们，
          # 而对应的包文件马上就要被清理掉，变成「看得见装不上」。
          mapfile -t debug_entries < <(
            tar -xzOf junlin03-aur.db.tar.gz --wildcards '*/desc' 2>/dev/null \
              | awk '/^%NAME%$/{getline;print}' | grep -- '-debug$' || true)
          if [ "${#debug_entries[@]}" -gt 0 ]; then
            echo "从数据库摘除 debug 条目: ${debug_entries[*]}"
            repo-remove junlin03-aur.db.tar.gz "${debug_entries[@]}"
          fi

          # repo-add 会为数据库留下 *.old 本地备份；它们不应成为仓库入口或 Release 资产。
          rm -f junlin03-aur.db.tar.gz.old junlin03-aur.files.tar.gz.old
          ls -lh

      - name: 部署至 GitHub Releases
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: current-repo
          name: "Custom Personal Repository"
          prerelease: false
          files: |
            deploy/*.pkg.tar.zst
            deploy/junlin03-aur.db*
            deploy/junlin03-aur.files*

      - name: 清理旧版本与多余的包资产
        if: steps.check_artifacts.outputs.has_artifacts == 'true' && steps.build_db.outputs.db_restored == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 以刚上传的数据库为唯一准绳：%FILENAME% 列出的才是 pacman 能看见的包，
          # 其余 .pkg.tar.zst 资产全是旧版本或已摘除的 debug 包，白占空间。
          # 这比「只看本轮构建了哪些包名」可靠：哪轮清理漏了，下一轮会自动补上。
          mapfile -t db_files < <(
            tar -xzOf deploy/junlin03-aur.db.tar.gz --wildcards '*/desc' \
              | awk '/^%FILENAME%$/{getline;print}')
          if [ "${#db_files[@]}" -eq 0 ]; then
            echo "::error::数据库里一个 %FILENAME% 都读不到，为安全起见不清理"
            exit 1
          fi

          # 库里的文件名可能带 epoch 冒号（mpv-git-1:0.41…），而 GitHub 资产名里的
          # 冒号已在上传前换成点号，比较前先统一成点号。
          declare -A keep=()
          for f in "${db_files[@]}"; do
            keep["${f//:/.}"]=1
          done

          mapfile -t release_assets < <(
            gh release view "$REPO_RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')

          # rc/正式版互保：當 DB 條目是 -rc 檔（RC 版本號更高而換掉了正式版條目），
          # 同家族最新的一份「非 -rc」資產額外保留，便於回退安裝；
          # 反向（DB 已是正式版）不保護 -rc 檔——正式版已涵蓋它，正常清理。
          declare -A rc_family=()
          for f in "${db_files[@]}"; do
            case "${f//:/.}" in
              *-rc-*) base="${f%%-rc-*}"; rc_family["$base"]=1 ;;
            esac
          done
          if [ "${#rc_family[@]}" -gt 0 ]; then
            declare -A newest_plain=()
            for asset in "${release_assets[@]}"; do
              [[ "$asset" == *.pkg.tar.zst ]] || continue
              case "$asset" in *-rc-*) continue ;; esac
              for base in "${!rc_family[@]}"; do
                [[ "$asset" == "$base-"* ]] || continue
                ver=$(printf '%s' "${asset#"$base"-}" | cut -d- -f1)
                if [ -z "${newest_plain[$base]+x}" ]                    || [ "$(vercmp "$ver" "${newest_plain[$base]%%-*}")" = "1" ]; then
                  newest_plain[$base]="$asset"
                fi
                break
              done
            done
            for base in "${!newest_plain[@]}"; do
              if [ -n "${keep[${newest_plain[$base]}]+x}" ]; then continue; fi
              echo "RC 在库，保留同家族最新正式版资产: ${newest_plain[$base]}"
              keep["${newest_plain[$base]}"]=1
            done
          fi

          for asset in "${release_assets[@]}"; do
            [[ "$asset" == *.pkg.tar.zst ]] || continue
            [ -n "${keep[$asset]+x}" ] && continue
            echo "删除数据库已不引用的资产: $asset"
            gh release delete-asset "$REPO_RELEASE_TAG" "$asset" --repo "$GH_REPO" --yes
          done
