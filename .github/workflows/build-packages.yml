              _qapp_url=$(printf '%s' "$_qapp" | jq -r '.artifacts[] | select(.id=="linux-rpm-x64") | .url' | head -n1)
              printf '%s' "$_qapp_sha" | grep -Eq '^[0-9a-fA-F]{64}$' \
                || skip "Qoder 桌面端 manifest 裡沒有 linux-rpm-x64 的 sha256"
              printf '%s' "$_qapp_url" | grep -q '^https://' \
                || skip "Qoder 桌面端 manifest 裡沒有 linux-rpm-x64 的 url"
              check_url_template source_x86_64 "$_qapp_url"
              echo "sha_x86=$_qapp_sha" >> "$GITHUB_OUTPUT"
