name: Build Pacman Repository

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo_name: [snd-pcsp-dkms, linux-zencjk, linux-ltscjk, linux-cachyos-cjktty]

    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: 释放 Runner 磁盘空间
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: 初始化 Arch Linux 环境
        run: |
          pacman -Syu --noconfirm git jq curl sudo devtools pacman-contrib

      - name: 拉取对应的套件仓库
        run: |
          git clone https://github.com/${{ github.repository_owner }}/${{ matrix.repo_name }}.git pkg_dir

      - name: 检查上游/AUR 更新并自动 Bump PKGBUILD
        id: update
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd pkg_dir

          # 解决 Git 安全目录问题
          git config --global --add safe.directory "$PWD"

          # 建立普通用户
          useradd builder -m || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

          # ------------------------------------------------------------
          # 1. 版本检测与 PKGBUILD 修改脚本
          # ------------------------------------------------------------
          cat > /tmp/update_version.sh << 'EOF'
          #!/bin/bash
          set -e
          REPO_NAME="$1"
          PKGBUILD="PKGBUILD"
          if [ ! -f "$PKGBUILD" ]; then
            echo "错误：找不到 PKGBUILD" >&2
            exit 1
          fi
          source "$PKGBUILD"
          current_pkgver="$pkgver"

          get_latest_info() {
            case "$REPO_NAME" in
              linux-zencjk)
                latest_tag=$(curl -s "https://api.github.com/repos/zen-kernel/zen-kernel/tags" | jq -r '.[0].name')
                latest_ver=$(echo "$latest_tag" | sed 's/^v//' | sed 's/-/./')
                echo "TYPE=zen;VERSION=$latest_ver"
                ;;
              linux-ltscjk)
                latest_ver=$(curl -s "https://www.kernel.org/releases.json" | jq -r '.releases[] | select(.version | startswith("6.12.")) | .version' | sort -V | tail -n1)
                echo "TYPE=lts;VERSION=$latest_ver"
                ;;
              linux-cachyos-cjktty)
                latest_tag=$(curl -s "https://api.github.com/repos/CachyOS/linux/tags" | jq -r '.[0].name')
                tag_part="${latest_tag#cachyos-}"
                if [[ "$tag_part" == *"-rc"* ]]; then
                  major="${tag_part%-rc*}"
                  rcver="rc${tag_part#*-rc}"
                  echo "TYPE=cachyos-rc;MAJOR=$major;RCVER=$rcver"
                else
                  ver_part="${tag_part%-*}"
                  tagrel="${tag_part##*-}"
                  major="${ver_part%.*}"
                  minor="${ver_part##*.}"
                  echo "TYPE=cachyos-release;MAJOR=$major;MINOR=$minor;TAGREL=$tagrel;VERSION=$ver_part"
                fi
                ;;
              snd-pcsp-dkms)
                latest_ver=$(curl -s "https://www.kernel.org/releases.json" | jq -r '.releases[] | select(.stable == true) | .version' | sort -V | tail -n1)
                echo "TYPE=snd;VERSION=$latest_ver"
                ;;
              *)
                echo "未知仓库: $REPO_NAME" >&2
                exit 1
            esac
          }

          info=$(get_latest_info)
          if [ -z "$info" ]; then
            echo "获取版本信息失败" >&2
            exit 1
          fi

          case "$REPO_NAME" in
            linux-zencjk)
              eval "$info"
              if [ "$current_pkgver" != "$VERSION" ]; then
                echo "检测到新版本: $VERSION (当前 $current_pkgver)"
                sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
                exit 0
              else
                echo "当前已是最新版本 $current_pkgver"
                exit 1
              fi
              ;;
            linux-ltscjk)
              eval "$info"
              if [ "$current_pkgver" != "$VERSION" ]; then
                echo "检测到新版本: $VERSION (当前 $current_pkgver)"
                sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
                exit 0
              else
                echo "当前已是最新版本 $current_pkgver"
                exit 1
              fi
              ;;
            linux-cachyos-cjktty)
              if [[ "$info" == TYPE=cachyos-rc* ]]; then
                eval "$info"
                expected_pkgver="${MAJOR}${RCVER}"
                if [ "$current_pkgver" != "$expected_pkgver" ]; then
                  echo "检测到新 RC 版本: $expected_pkgver (当前 $current_pkgver)"
                  sed -i "s/^_major=.*/_major=$MAJOR/" "$PKGBUILD"
                  sed -i "s/^_minor=.*/#_minor=/" "$PKGBUILD"
                  sed -i "s/^#_rcver=.*/_rcver=$RCVER/; s/^_rcver=.*/_rcver=$RCVER/" "$PKGBUILD"
                  sed -i "s/^pkgver=.*/pkgver=$expected_pkgver/" "$PKGBUILD"
                  sed -i "s/^_srcname=.*/_srcname=cachyos-${MAJOR}-${RCVER}/" "$PKGBUILD"
                  exit 0
                else
                  echo "当前已是最新 RC 版本 $current_pkgver"
                  exit 1
                fi
              else
                eval "$info"
                if [ "$current_pkgver" != "$VERSION" ]; then
                  echo "检测到新正式版本: $VERSION (当前 $current_pkgver)"
                  sed -i "s/^_major=.*/_major=$MAJOR/" "$PKGBUILD"
                  sed -i "s/^#_minor=.*/_minor=$MINOR/; s/^_minor=.*/_minor=$MINOR/" "$PKGBUILD"
                  sed -i "s/^_rcver=.*/#_rcver=/" "$PKGBUILD"
                  sed -i "s/^_tagrel=.*/_tagrel=$TAGREL/" "$PKGBUILD"
                  sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
                  sed -i "s/^_srcname=.*/_srcname=cachyos-${MAJOR}.${MINOR}-${TAGREL}/" "$PKGBUILD"
                  exit 0
                else
                  echo "当前已是最新正式版本 $current_pkgver"
                  exit 1
                fi
              fi
              ;;
            snd-pcsp-dkms)
              eval "$info"
              if [ "$current_pkgver" != "$VERSION" ]; then
                echo "检测到新稳定内核版本: $VERSION (当前 $current_pkgver)"
                sed -i "s/^pkgver=.*/pkgver=$VERSION/" "$PKGBUILD"
                exit 0
              else
                echo "当前已是最新稳定版本 $current_pkgver"
                exit 1
              fi
              ;;
          esac
          EOF

          # 赋予脚本执行权限
          chmod +x /tmp/update_version.sh

          /tmp/update_version.sh "${{ matrix.repo_name }}" || true

          # ------------------------------------------------------------
          # 2. 更新校验和与 .SRCINFO
          # ------------------------------------------------------------
          su builder -c "updpkgsums" || true
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

          # 检查是否有改动
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add PKGBUILD .SRCINFO
            git commit -m "chore: auto update PKGBUILD & .SRCINFO" || true
            git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${{ matrix.repo_name }}.git main || true
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 云端编译 `.pkg.tar.zst`
        if: steps.update.outputs.changed == 'true'
        run: |
          cd pkg_dir
          chown -R builder:builder .
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf
          sed -i 's/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -)/' /etc/makepkg.conf
          su builder -c "makepkg -syn --noconfirm"

      - name: 暂存构建好的 `.pkg.tar.zst` 产物
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.repo_name }}
          path: pkg_dir/*.pkg.tar.zst

  deploy-repo:
    needs: build-packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: 安装工具
        run: |
          pacman -Syu --noconfirm github-cli

      - name: 下载所有子 Job 构建好的 `.pkg.tar.zst`
        uses: actions/download-artifact@v4
        with:
          path: artifact-downloads

      - name: 检查是否有构建产物
        id: check_artifacts
        run: |
          if [ -z "$(find artifact-downloads -name '*.pkg.tar.zst' -print -quit)" ]; then
            echo "没有构建产物，跳过部署"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          fi

      - name: 整合并更新 repo.db 数据库
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy
          find artifact-downloads -name "*.pkg.tar.zst" -exec cp {} deploy/ \;
          cd deploy
          gh release download current-repo --repo ${{ github.repository }} -p "junlin03-aur.db*" --clobber || true
          repo-add -n -R junlin03-aur.db.tar.gz *.pkg.tar.zst

      - name: 部署至 GitHub Releases
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current-repo
          name: "Custom Personal Repository"
          prerelease: false
          files: |
            deploy/*.pkg.tar.zst
            deploy/junlin03-aur.db*
            deploy/junlin03-aur.files*
