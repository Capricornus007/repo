name: Build Pacman Repository

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 自动取消正在运行的同分支旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo_name: [snd-pcsp-dkms, linux-zencjk, linux-ltscjk, linux-cachyos-cjktty]

    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: 释放 Runner 磁盘空间
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: 初始化 Arch Linux 环境
        run: |
          pacman -Syu --noconfirm git jq curl sudo devtools pacman-contrib

      - name: 拉取对应的套件仓库
        run: |
          git clone https://github.com/${{ github.repository_owner }}/${{ matrix.repo_name }}.git pkg_dir

      - name: 检查上游/AUR 更新并自动 Bump PKGBUILD
        id: update
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ matrix.repo_name }}
        run: |
          cd pkg_dir

          # 解决 Git 安全目录问题
          git config --global --add safe.directory "$PWD"

          # 建立普通用户
          useradd builder -m || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

          # ------------------------------------------------------------
          # 版本检测与 PKGBUILD 修改脚本（完全重写）
          # ------------------------------------------------------------
          cat > /tmp/update_version.sh << 'EOF'
          #!/bin/bash
          set -e

          REPO_NAME="$1"
          PKGBUILD="PKGBUILD"
          if [ ! -f "$PKGBUILD" ]; then
            echo "错误：找不到 PKGBUILD" >&2
            exit 1
          fi

          source "$PKGBUILD"
          current_pkgver="$pkgver"
          changed=false

          case "$REPO_NAME" in
            linux-zencjk)
              latest_tag=$(curl -s "https://api.github.com/repos/zen-kernel/zen-kernel/tags" | jq -r '.[0].name')
              latest_ver=$(echo "$latest_tag" | sed 's/^v//' | sed 's/-/./')
              if [ "$current_pkgver" != "$latest_ver" ]; then
                echo "检测到新版本: $latest_ver (当前 $current_pkgver)"
                sed -i "s/^pkgver=.*/pkgver=$latest_ver/" "$PKGBUILD"
                changed=true
              else
                echo "当前已是最新版本 $current_pkgver"
              fi
              ;;

            linux-ltscjk)
              latest_ver=$(curl -s "https://www.kernel.org/releases.json" | jq -r '.releases[] | select(.version | startswith("6.12.")) | .version' | sort -V | tail -n1)
              if [ "$current_pkgver" != "$latest_ver" ]; then
                echo "检测到新版本: $latest_ver (当前 $current_pkgver)"
                sed -i "s/^pkgver=.*/pkgver=$latest_ver/" "$PKGBUILD"
                changed=true
              else
                echo "当前已是最新版本 $current_pkgver"
              fi
              ;;

            linux-cachyos-cjktty)
              all_tags=$(curl -s "https://api.github.com/repos/CachyOS/linux/releases" | jq -r '.[].tag_name | select(test("^cachyos-7\\."))')
              release_tag=$(echo "$all_tags" | grep -v '\-rc' | sort -V | tail -n1)
              rc_tag=$(echo "$all_tags" | grep '\-rc' | sort -V | tail -n1)

              echo "RELEASE_TAG=$release_tag" > /tmp/cachyos_versions
              echo "RC_TAG=$rc_tag" >> /tmp/cachyos_versions

              changed_local=false
              if [ -n "$release_tag" ]; then
                ver_part="${release_tag#cachyos-}"
                ver_part="${ver_part%-*}"
                if [ "$ver_part" != "$current_pkgver" ]; then
                  changed_local=true
                fi
              fi
              if [ "$changed_local" = "false" ] && [ -n "$rc_tag" ]; then
                ver_part="${rc_tag#cachyos-}"
                rc_ver="${ver_part%-*}"
                rc_ver="${rc_ver//-/}"
                if [ "$rc_ver" != "$current_pkgver" ]; then
                  changed_local=true
                fi
              fi

              if [ "$changed_local" = "true" ]; then
                echo "检测到更新：正式版 $release_tag, RC版 $rc_tag"
                changed=true
              else
                echo "当前已是最新版本"
              fi
              ;;

            snd-pcsp-dkms)
              latest_ver=$(curl -s "https://www.kernel.org/releases.json" | jq -r '.latest_stable.version')
              if [ "$current_pkgver" != "$latest_ver" ]; then
                echo "检测到新稳定内核版本: $latest_ver (当前 $current_pkgver)"
                sed -i "s/^pkgver=.*/pkgver=$latest_ver/" "$PKGBUILD"
                changed=true
              else
                echo "当前已是最新稳定版本 $current_pkgver"
              fi
              ;;

            *)
              echo "未知仓库: $REPO_NAME" >&2
              exit 1
              ;;
          esac

          if [ "$changed" = "true" ]; then
            if [ "$REPO_NAME" != "linux-cachyos-cjktty" ]; then
              su builder -c "updpkgsums" || true
              su builder -c "makepkg --printsrcinfo > .SRCINFO"
              git add PKGBUILD .SRCINFO
              git commit -m "chore: auto update PKGBUILD & .SRCINFO" || true
              git push https://x-access-token:${GH_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.git HEAD || true
            fi
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          EOF

          chmod +x /tmp/update_version.sh
          /tmp/update_version.sh "${{ matrix.repo_name }}" || true

      - name: 云端编译 `.pkg.tar.zst`
        if: steps.update.outputs.changed == 'true'
        run: |
          cd pkg_dir

          if [ "${{ matrix.repo_name }}" = "linux-cachyos-cjktty" ] && [ -f /tmp/cachyos_versions ]; then
            source /tmp/cachyos_versions
            echo "准备构建两个版本：正式版 $RELEASE_TAG，RC版 $RC_TAG"

            build_version() {
              local tag=$1
              if [ -z "$tag" ]; then
                echo "跳过空版本"
                return
              fi
              echo "构建版本：$tag"
              tag_part="${tag#cachyos-}"

              # ---- 根据版本类型下载对应的 config 并追加 CJK 支持 ----
              if [[ "$tag" == *"-rc"* ]]; then
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/config"
              else
                config_url="https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/config"
              fi
              echo "下载 config 文件：$config_url"
              curl -s -o config "$config_url" || { echo "错误：下载 config 失败"; exit 1; }
              # 无损追加 CJK 字体支持
              if ! grep -q "CONFIG_FONT_CJK_16x16=y" config; then
                echo "CONFIG_FONT_CJK_16x16=y" >> config
              fi
              if ! grep -q "CONFIG_FONT_CJK_32x32=y" config; then
                echo "CONFIG_FONT_CJK_32x32=y" >> config
              fi

              # 追加 dae 運行支援
              if ! grep -q "CONFIG_NET_CLS_ACT=y" config; then
                echo "CONFIG_NET_CLS_ACT=y" >> config
              fi
              if ! grep -q "CONFIG_NET_CLS_BPF=y" config; then
                echo "CONFIG_NET_CLS_BPF=y" >> config
              fi
              if ! grep -q "CONFIG_BPF_TC=y" config; then
                echo "CONFIG_BPF_TC=y" >> config
              fi
              if ! grep -q "CONFIG_NET_SCH_CLSACT=y" config; then
                echo "CONFIG_NET_SCH_CLSACT=y" >> config
              fi

              # ---- 根据 tag 决定使用哪个补丁（7.1 或 7.2） ----
              if [[ "$tag" == *"7.2"* ]]; then
                patch_version="7.2-rc7"
              else
                patch_version="7.1"
              fi
              patch_url="https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master/v7.x/cjktty-${patch_version}.patch"
              echo "下载补丁文件：$patch_url"
              curl -s -L -o "0001-cjktty.patch" "$patch_url" || { echo "错误：下载补丁失败"; exit 1; }

              # ---- 解析版本信息 ----
              if [[ "$tag_part" == *"-rc"* ]]; then
                major="${tag_part%-rc*}"
                rcver="rc${tag_part#*-rc}"
                rcver="${rcver%-*}"
                srcname="${tag}"
                srcname="${tag}"
              else
                ver_part="${tag_part%-*}"
                tagrel="${tag_part##*-}"
                major="${ver_part%.*}"
                minor="${ver_part##*.}"
                pkgver="${ver_part}"
                srcname="cachyos-${major}.${minor}-${tagrel}"
              fi

              cp PKGBUILD PKGBUILD.bak
              sed -i "s/^pkgver=.*/pkgver=$pkgver/" PKGBUILD
              sed -i "s/^_srcname=.*/_srcname=$srcname/" PKGBUILD
              # ---- 修改补丁 source 行，使用本地文件 ----
              sed -i 's|^[[:space:]]*"0001-cjktty.patch::.*|  "0001-cjktty.patch"|' PKGBUILD
              if [[ "$tag" == *"-rc"* ]]; then
                sed -i "s/^_major=.*/_major=$major/" PKGBUILD
                sed -i "s/^_minor=.*/#_minor=/" PKGBUILD
                sed -i "s/^#_rcver=.*/_rcver=$rcver/; s/^_rcver=.*/_rcver=$rcver/" PKGBUILD
              else
                sed -i "s/^_major=.*/_major=$major/" PKGBUILD
                sed -i "s/^_minor=.*/_minor=$minor/" PKGBUILD
                sed -i "s/^_rcver=.*/#_rcver=/" PKGBUILD
                sed -i "s/^_tagrel=.*/_tagrel=$tagrel/" PKGBUILD
              fi

              chown -R builder:builder .
              su builder -c "makepkg -s --noconfirm --skipinteg" || {
                echo "构建失败：$tag"
                mv PKGBUILD.bak PKGBUILD
                exit 1
              }
              mv PKGBUILD.bak PKGBUILD
            }

            build_version "$RELEASE_TAG"
            build_version "$RC_TAG"
          else
            # 其他包的单次构建（原逻辑）
            chown -R builder:builder .
            sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf
            sed -i 's/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -)/' /etc/makepkg.conf
            su builder -c "makepkg -s --noconfirm"
          fi

      - name: 暂存构建好的 `.pkg.tar.zst` 产物
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.repo_name }}
          path: pkg_dir/*.pkg.tar.zst

  deploy-repo:
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel

    steps:
      - name: 安装工具
        run: |
          pacman -Syu --noconfirm github-cli

      - name: 下载所有子 Job 构建好的 `.pkg.tar.zst`
        uses: actions/download-artifact@v4
        with:
          path: artifact-downloads

      - name: 检查是否有构建产物
        id: check_artifacts
        run: |
          if [ -z "$(find artifact-downloads -name '*.pkg.tar.zst' -print -quit)" ]; then
            echo "没有构建产物，跳过部署"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          fi

      - name: 整合并更新 repo.db 数据库
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy
          find artifact-downloads -name "*.pkg.tar.zst" -exec cp {} deploy/ \;
          cd deploy
          gh release download current-repo --repo ${{ github.repository }} -p "junlin03-aur.db*" --clobber || true
          repo-add -n -R junlin03-aur.db.tar.gz *.pkg.tar.zst

      - name: 部署至 GitHub Releases
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current-repo
          name: "Custom Personal Repository"
          prerelease: false
          files: |
            deploy/*.pkg.tar.zst
            deploy/junlin03-aur.db*
            deploy/junlin03-aur.files*
